name = "couch-riot"
main = "server/src/index.js"
compatibility_date = "2025-09-01"

# Optional: lock the relay to your game page. Comma-separated origins, e.g.
# ALLOWED_ORIGINS = "https://duckunicorn.github.io"
[vars]
ALLOWED_ORIGINS = ""

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects work on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Song library storage (Workers KV). Create a namespace in the Cloudflare dashboard
# (Storage & Databases > Workers KV > Create), then paste its ID below and uncomment.
# Also add a secret named LIBRARY_KEY on the Worker (Settings > Variables and Secrets).
[[kv_namespaces]]
binding = "SONGS"
id = "43cd9ed1ba4242b7a23ba2652ec643d8"
