    const secret = pick(SECRETS, 1)[0], faker = pick(roster, 1)[0];
    stage(`<div class="eyebrow">Round ${r + 1} of 3 · Category: ${esc(secret.cat)}</div><h1 class="big">Check your phone</h1><p class="sub">Everyone knows the secret word. Almost everyone.</p>`);
    const clues = await collect(roster, p => p === faker
      ? { kind: 'text', prompt: 'You\'re not briefed!', sub: `You are the faker. The category is ${secret.cat}. Give a one-word clue that blends in.`, max: 24 }
      : { kind: 'text', prompt: `The secret word is ${secret.word}`, sub: `Category: ${secret.cat}. Give a one-word clue. Too obvious and the faker learns the word.`, max: 24 },
      { seconds: 45, after: 'Clue locked in.' });
    stage(`<div class="eyebrow">Category: ${esc(secret.cat)}</div><h1 class="big" style="font-size:clamp(26px,3vw,70px)">The clues</h1>
      <div class="cluegrid">${roster.map(p => `<div class="clue" style="--c:${p.color}"><span>${esc(p.name)}</span><b>${esc(clues.get(p.id) || '…')}</b></div>`).join('')}</div>
      <p class="sub">Discuss out loud. Who's faking it?</p>`);
    roster.forEach(p => waitView(p, p === faker ? 'Stay calm. Act briefed.' : 'Discuss! Who is the faker?'));
    await timer(60, 'Start voting');
    const votes = await collect(roster, p => ({ kind: 'choose', prompt: 'Who isn\'t briefed?', options: roster.filter(o => o !== p).map(o => ({ id: o.id, label: o.name, color: o.color })) }), { seconds: 30 });
    const tally = new Map(); for (const v of votes.values()) tally.set(v, (tally.get(v) || 0) + 1);
    const max = Math.max(0, ...tally.values());
    const tops = [...tally].filter(([, n]) => n === max).map(([id]) => id);
    const accused = tops.length === 1 ? byId(tops[0]) : null;
    const crew = roster.filter(p => p !== faker);
    let result;
    if (accused === faker) {
      stage(`<div class="eyebrow">Caught!</div><div class="winner" style="--c:${faker.color};font-size:4em">${esc(faker.name)}</div><p class="sub">was the faker. One last chance: they can steal the round by guessing the word.</p>`);
      const g = await collect([faker], () => ({ kind: 'text', prompt: 'Guess the secret word', sub: `Category: ${secret.cat}`, max: 30 }), { seconds: 30 });
      const guess = String(g.get(faker.id) || '').trim();
      if (guess && norm(guess) === norm(secret.word)) { faker.score += 1; result = `${esc(faker.name)} guessed <b>${esc(secret.word)}</b> and steals the round!`; }
      else { crew.forEach(p => p.score++); result = `${esc(faker.name)} guessed "${esc(guess || 'nothing')}". The crew wins. +1 each.`; }
    } else {
      faker.score += 2;
      result = `${accused ? `You accused ${esc(accused.name)}.` : 'The vote was split.'} The faker escapes with 2 points.`;
    }
    stage(`<div class="eyebrow">The word was</div><div class="bignum" style="font-size:clamp(50px,7vw,160px)">${esc(secret.word)}</div>
      <h2 style="font-size:1.8em">Faker: <span style="color:${faker.color}">${esc(faker.name)}</span></h2><p class="sub">${result}</p>
      <div class="minicards">${roster.map(p => `<span class="chip" style="--c:${p.color}"><i></i>${esc(p.name)} → ${esc(byId(votes.get(p.id))?.name || '—')}</span>`).join('')}</div>`);
    roster.forEach(p => waitView(p, `The word was ${secret.word}.`));
    await hostNext(r < 2 ? 'Next round' : 'Final standings');
  }
  await leaderboard(roster, 'Best poker face');
}

/* ---------------- Real-time helpers ---------------- */
function runLoop(step) {
  return guard(done => {
    let last = performance.now(), raf = 0, stopped = false;
    const tick = now => {
      if (stopped) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (step(dt, now)) { stopped = true; done(); } else raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    H.cleanup.push(() => { stopped = true; cancelAnimationFrame(raf); });
  });
}
function padAll(roster, text, color) { roster.forEach(p => send(p, { t: 'pad', text, color })); }
async function countIn(title, sub) {
  for (const n of [3, 2, 1]) { stage(`<div class="eyebrow">${esc(title)}</div><div class="bignum">${n}</div><p class="sub">${sub}</p>`); await sleep(900); }
}
function bestRecord(key, score) {
  const k = 'couchriot-best-' + key, prev = Number(store.get(k)) || 0;
  if (score > prev) store.set(k, String(score));
  return { prev, best: Math.max(prev, score), isNew: score > prev };
}

/* ---------------- Game: Hot Potato Phone ---------------- */
async function runHotPotato(roster) {
  await intro('Hot Potato Phone', 'Whoever holds the bomb answers the category on their phone, then passes it on. No repeats. The fuse is secret. Survive the explosion to score.');
  for (let r = 0; r < 3; r++) {
    const cat = pick(POTATO_CATS, 1)[0], used = [];
    let holder = pick(roster, 1)[0], exploded = false;
    const fuse = 25000 + Math.random() * 25000, t0 = Date.now();
    const tf = setTimeout(() => { exploded = true; H.pending?.finish?.(); }, fuse);
    H.cleanup.push(() => clearTimeout(tf));
    const render = () => {
      const spd = Math.max(0.22, 1.1 - (Date.now() - t0) / 45000);
      stage(`<div class="eyebrow">Round ${r + 1} of 3</div><h1 class="big">${esc(cat)}</h1>
        <div class="potato"><div class="bomb" style="--spd:${spd}s"></div><div><div class="sub">The bomb is with</div><div class="winner" style="--c:${holder.color};font-size:3.2em">${esc(holder.name)}</div></div></div>
        <div class="usedlist">${used.map(u => `<span class="chip" style="--c:${u.p.color}"><i></i>${esc(u.text)}</span>`).join('')}</div>`);
    };
    while (!exploded) {
      render();
      roster.forEach(o => o !== holder && waitView(o, `${holder.name} has the bomb!`));
      let err = '', answer = null;
      while (!exploded) {
        const res = await collect([holder], () => ({ kind: 'text', prompt: cat, sub: err || 'Answer fast, then pass the bomb.', max: 40 }), { after: 'Quick, pick who gets it next…' });
        if (exploded) break;
        const a = String(res.get(holder.id) || '').trim();
        if (!a) { err = 'Type something!'; continue; }
        if (used.some(u => norm(u.text) === norm(a))) { err = `"${a}" was already said! Try again.`; continue; }
        answer = a; break;
      }
      if (exploded) break;
      used.push({ text: answer, p: holder }); render();
      const tg = await collect([holder], () => ({ kind: 'choose', prompt: 'Pass the bomb to…', options: roster.filter(o => o !== holder).map(o => ({ id: o.id, label: o.name, color: o.color })) }));
      if (exploded) break;
      holder = byId(tg.get(holder.id)) || holder;
    }
    clearTimeout(tf);
    roster.forEach(o => { if (o !== holder) o.score++; });
    stage(`<div class="eyebrow">${esc(cat)} · ${used.length} answers</div><div class="bignum boom">BOOM</div><div class="winner" style="--c:${holder.color}">${esc(holder.name)} was holding it</div><p class="sub">Everyone else survives. +1.</p>`);
    roster.forEach(o => waitView(o, o === holder ? 'BOOM. You were holding the bomb.' : `BOOM! ${holder.name} exploded. You survived.`));
    await hostNext(r < 2 ? 'Next round' : 'Final standings');
  }
  await leaderboard(roster, 'Steadiest hands', 'survived');
}

/* ---------------- Game: Red Light, Green Light ---------------- */
async function runRedLight(roster) {
  await intro('Red Light, Green Light', 'Hold the button on your phone to run. When the light turns red, let go right away. Anyone caught moving is out for the round. First across wins 3 points, second 2, everyone else who finishes 1.');
  for (let r = 0; r < 3; r++) {
    const st = new Map(roster.map(p => [p.id, { x: 0, hold: false, out: false, done: false, place: 0 }]));
    H.onInput = (p, v) => { const s = st.get(p.id); if (s) s.hold = !!v; };
    roster.forEach(p => setView(p, { kind: 'pad', mode: 'hold', title: `Round ${r + 1} of 3`, label: 'HOLD TO RUN', sub: 'Let go the moment it turns red.' }));
    await countIn(`Round ${r + 1} of 3`, 'Fingers on the button.');
    stage(`<div class="rl"><div class="rlbanner" id="rlb"></div><div class="lanes">${roster.map(p => `<div class="lane" style="--c:${p.color}"><span class="lname">${esc(p.name)}</span><div class="ltrack"><i id="dot-${p.id}"></i></div></div>`).join('')}</div></div>`);
    const banner = $('#rlb');
    let light = 'green', phaseEnd = 0, phaseStart = 0, places = 0, elapsed = 0;
    const setLight = (l, now) => {
      light = l; phaseStart = now;
      phaseEnd = now + (l === 'green' ? 1500 + Math.random() * 2500 : l === 'turning' ? 650 : 1500 + Math.random() * 1500);
      banner.className = 'rlbanner ' + l;
      banner.textContent = l === 'green' ? 'GREEN LIGHT' : l === 'turning' ? 'TURNING…' : 'RED LIGHT';
      padAll(roster, banner.textContent, l === 'green' ? '#5fe0b5' : l === 'turning' ? '#ffd84d' : '#ff5d5d');
    };
    await runLoop((dt, now) => {
      if (!phaseStart) setLight('green', now);
      elapsed += dt;
      if (now >= phaseEnd) setLight(light === 'green' ? 'turning' : light === 'turning' ? 'red' : 'green', now);
      for (const p of roster) {
        const s = st.get(p.id); if (s.out || s.done) continue;
        if (light === 'red' && now - phaseStart > 250 && s.hold) {
          s.out = true; send(p, { t: 'pad', text: 'CAUGHT! You\'re out.', color: '#ff5d5d' });
        } else if (s.hold && light !== 'red') {
          s.x = Math.min(100, s.x + dt * 13);
          if (s.x >= 100) { s.done = true; s.place = ++places; send(p, { t: 'pad', text: `Finished #${s.place}!`, color: '#5fe0b5' }); }
        }
        const dot = document.getElementById('dot-' + p.id);
        if (dot) { dot.style.left = `calc(${s.x}% - ${s.x * 0.018}em)`; dot.className = s.out ? 'out' : s.done ? 'done' : s.hold ? 'run' : ''; }
      }
      return roster.every(p => st.get(p.id).out || st.get(p.id).done) || elapsed > 60;
    });
    H.onInput = null;
    const fin = roster.filter(p => st.get(p.id).done).sort((a, b) => st.get(a.id).place - st.get(b.id).place);
    fin.forEach((p, i) => p.score += i === 0 ? 3 : i === 1 ? 2 : 1);
    const outs = roster.filter(p => st.get(p.id).out);
    stage(`<div class="eyebrow">Round ${r + 1} results</div>
      <div class="board">${fin.map((p, i) => `<div class="brow"><span class="rank">${i + 1}</span><span style="color:${i ? p.color : 'inherit'}">${esc(p.name)}</span><span class="pts">+${i === 0 ? 3 : i === 1 ? 2 : 1}</span></div>`).join('') || '<p class="sub">Nobody made it across.</p>'}</div>
      ${outs.length ? `<p class="sub">Caught moving: ${nameList(outs)}</p>` : ''}`);
    roster.forEach(p => waitView(p, st.get(p.id).done ? `You finished #${st.get(p.id).place}.` : st.get(p.id).out ? 'Caught moving. Next round!' : 'Time ran out.'));
    await hostNext(r < 2 ? 'Next round' : 'Final standings');
  }
  await leaderboard(roster, 'Fastest feet');
}

/* ---------------- Game: Crowd Pilot ---------------- */
async function runCrowdPilot(roster) {
  await intro('Crowd Pilot', 'One ship. Every phone fires one thruster, but nobody knows which direction theirs pushes until they try it. Work together to grab stars and dodge the rocks. 75 seconds.');
  const W = 1600, Hh = 900, ACC = 650, R = 26;
  const off = Math.random() * Math.PI * 2;
  const thr = shuffle(roster).map((p, i, a) => { const ang = off + i / a.length * Math.PI * 2; return { p, ax: Math.cos(ang), ay: Math.sin(ang), on: false }; });
  H.onInput = (p, v) => { const t = thr.find(t => t.p === p); if (t) t.on = !!v; };
  roster.forEach(p => setView(p, { kind: 'pad', mode: 'hold', title: 'Crowd Pilot', label: 'THRUST', sub: 'Hold to fire your thruster. Watch the screen to see which way it pushes.', color: p.color }));
  await countIn('Crowd Pilot', 'Figure out which thruster is yours.');
  stage(`<canvas id="cv" class="cv" width="${W}" height="${Hh}"></canvas>`);
  const cv = $('#cv'), c = cv.getContext('2d');
  const ship = { x: W / 2, y: Hh / 2, vx: 0, vy: 0, inv: 0 };
  const newStar = () => { let s; do { s = { x: 100 + Math.random() * (W - 200), y: 100 + Math.random() * (Hh - 200) }; } while (Math.hypot(s.x - ship.x, s.y - ship.y) < 300); return s; };
  let star = newStar(), score = 0, time = 75, flash = 0;
  const rocks = Array.from({ length: 4 }, (_, i) => ({ x: i % 2 ? 150 : W - 150, y: i < 2 ? 150 : Hh - 150, vx: (Math.random() - .5) * 260, vy: (Math.random() - .5) * 260, r: 34 + Math.random() * 22 }));
  const bgStars = Array.from({ length: 90 }, () => [Math.random() * W, Math.random() * Hh, Math.random() * 1.6 + .4]);
  const starPath = (x, y, ro, ri) => { c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? ri : ro; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } c.closePath(); };
  await runLoop((dt, now) => {
    time -= dt; ship.inv = Math.max(0, ship.inv - dt); flash = Math.max(0, flash - dt);
    for (const t of thr) if (t.on) { ship.vx += t.ax * ACC * dt; ship.vy += t.ay * ACC * dt; }
    const damp = Math.pow(0.55, dt); ship.vx *= damp; ship.vy *= damp;
    ship.x += ship.vx * dt; ship.y += ship.vy * dt;
    if (ship.x < R) { ship.x = R; ship.vx = Math.abs(ship.vx) * .6; } if (ship.x > W - R) { ship.x = W - R; ship.vx = -Math.abs(ship.vx) * .6; }
    if (ship.y < R) { ship.y = R; ship.vy = Math.abs(ship.vy) * .6; } if (ship.y > Hh - R) { ship.y = Hh - R; ship.vy = -Math.abs(ship.vy) * .6; }
    if (Math.hypot(star.x - ship.x, star.y - ship.y) < 58) { score++; flash = .4; star = newStar(); }
    for (const k of rocks) {
      k.x += k.vx * dt; k.y += k.vy * dt;
      if (k.x < k.r || k.x > W - k.r) k.vx *= -1; if (k.y < k.r || k.y > Hh - k.r) k.vy *= -1;
      k.x = Math.min(W - k.r, Math.max(k.r, k.x)); k.y = Math.min(Hh - k.r, Math.max(k.r, k.y));
      const d = Math.hypot(k.x - ship.x, k.y - ship.y);
      if (d < k.r + R && !ship.inv) { score = Math.max(0, score - 1); ship.inv = 1.2; const nx = (ship.x - k.x) / d, ny = (ship.y - k.y) / d; ship.vx = nx * 420; ship.vy = ny * 420; }
    }
    // draw
    c.fillStyle = '#0b0e22'; c.fillRect(0, 0, W, Hh);
    c.fillStyle = '#3a4180'; for (const [x, y, s] of bgStars) { c.fillRect(x, y, s, s); }
    c.fillStyle = '#ffd84d'; starPath(star.x, star.y, 30 + Math.sin(now / 200) * 3, 13); c.fill();
    for (const k of rocks) { c.fillStyle = '#5b4a6e'; c.beginPath(); c.arc(k.x, k.y, k.r, 0, 7); c.fill(); c.fillStyle = '#463857'; c.beginPath(); c.arc(k.x - k.r * .3, k.y - k.r * .2, k.r * .28, 0, 7); c.arc(k.x + k.r * .35, k.y + k.r * .3, k.r * .18, 0, 7); c.fill(); }
    for (const t of thr) {
      const bx = ship.x - t.ax * R, by = ship.y - t.ay * R;
      c.fillStyle = '#2f3874'; c.beginPath(); c.arc(bx, by, 7, 0, 7); c.fill();
      if (t.on) {
        const len = 46 + Math.random() * 18, ex = ship.x - t.ax * (R + len), ey = ship.y - t.ay * (R + len);
        c.strokeStyle = t.p.color; c.lineWidth = 14; c.lineCap = 'round'; c.beginPath(); c.moveTo(bx, by); c.lineTo(ex, ey); c.stroke();
        c.fillStyle = t.p.color; c.font = '700 26px "Familjen Grotesk", system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(t.p.name, ship.x - t.ax * (R + len + 34), ship.y - t.ay * (R + len + 34));
      }
    }
    c.globalAlpha = ship.inv && Math.floor(now / 90) % 2 ? .35 : 1;
    c.fillStyle = '#f7efe2'; c.beginPath(); c.arc(ship.x, ship.y, R, 0, 7); c.fill();
    c.fillStyle = '#6ec8ff'; c.beginPath(); c.arc(ship.x, ship.y, R * .45, 0, 7); c.fill();
    c.globalAlpha = 1;
    c.fillStyle = flash ? '#ffd84d' : '#f7efe2'; c.font = '400 54px "Dela Gothic One", Impact, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'top';
    c.fillText(`★ ${score}`, 30, 24);
    c.textAlign = 'right'; c.fillStyle = time < 10 ? '#ff7a45' : '#f7efe2'; c.fillText(Math.ceil(Math.max(0, time)), W - 30, 24);
    return time <= 0;
  });
  H.onInput = null;
  roster.forEach(p => p.score = score);
  const rec = bestRecord('pilot', score);
  stage(`<div class="eyebrow">Mission complete</div><div class="bignum">${score} ★</div><h2 style="font-size:2em">${rec.isNew ? 'New best on this screen!' : `Best on this screen: ${rec.best}`}</h2><p class="sub">The crew: ${nameList(roster)}</p>`);
  roster.forEach(p => waitView(p, `The crew collected ${score} stars.`));
  await hostNext('Back to menu');
}

/* ---------------- Game: Stock the Fridge ---------------- */
async function runFridge(roster) {
  await intro('Stock the Fridge', 'Falling groceries, one fridge. Each phone does exactly one move: left, right, rotate, or drop. Fill a whole shelf row to clear it. Talk to each other! 2 minutes.');
  const COLS = 8, ROWS = 14, CELL = 60, W = COLS * CELL, Hh = ROWS * CELL;
  const SH = {
    I: { m: [[1, 1, 1, 1]], c: '#e8f1ff', n: 'Milk' }, O: { m: [[1, 1], [1, 1]], c: '#ffd84d', n: 'Cheese' },
    T: { m: [[1, 1, 1], [0, 1, 0]], c: '#ff7a45', n: 'Leftovers' }, S: { m: [[0, 1, 1], [1, 1, 0]], c: '#5fe0b5', n: 'Lettuce' },
    Z: { m: [[1, 1, 0], [0, 1, 1]], c: '#ff5d5d', n: 'Ketchup' }, L: { m: [[1, 0], [1, 0], [1, 1]], c: '#ffb36b', n: 'Juice' },
    J: { m: [[0, 1], [0, 1], [1, 1]], c: '#b9a7ff', n: 'Grapes' }
  };
  const ROLES = [{ k: 'left', label: '◀ LEFT' }, { k: 'right', label: 'RIGHT ▶' }, { k: 'rotate', label: '⟳ ROTATE' }, { k: 'drop', label: 'DROP ▼' }];
  const roles = new Map(shuffle(roster).map((p, i) => [p.id, ROLES[i % ROLES.length]]));
  const grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  const rot = m => m[0].map((_, i) => m.map(row => row[i]).reverse());
  const fits = (m, x, y) => m.every((row, j) => row.every((v, i) => !v || (x + i >= 0 && x + i < COLS && y + j < ROWS && (y + j < 0 || !grid[y + j][x + i]))));
  let piece = null, lines = 0, time = 120, over = false, acc = 0;
  const spawn = () => { const s = SH[pick(Object.keys(SH), 1)[0]]; piece = { m: s.m, c: s.c, n: s.n, x: Math.floor((COLS - s.m[0].length) / 2), y: 0 }; if (!fits(piece.m, piece.x, piece.y)) over = true; };
  const lock = () => {
    piece.m.forEach((row, j) => row.forEach((v, i) => { if (v && piece.y + j >= 0) grid[piece.y + j][piece.x + i] = piece.c; }));
    for (let y = ROWS - 1; y >= 0; y--) if (grid[y].every(Boolean)) { grid.splice(y, 1); grid.unshift(Array(COLS).fill(null)); lines++; y++; }
    spawn();
  };
  const flashRole = p => { const el = document.getElementById('role-' + p.id); if (el) { el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); } };
  H.onInput = (p, v) => {
    if (!v || !piece || over) return;
    const k = roles.get(p.id)?.k; flashRole(p);
    if (k === 'left' && fits(piece.m, piece.x - 1, piece.y)) piece.x--;
    else if (k === 'right' && fits(piece.m, piece.x + 1, piece.y)) piece.x++;
    else if (k === 'rotate') { const m = rot(piece.m); for (const dx of [0, -1, 1, -2, 2]) if (fits(m, piece.x + dx, piece.y)) { piece.m = m; piece.x += dx; break; } }
    else if (k === 'drop') { while (fits(piece.m, piece.x, piece.y + 1)) piece.y++; lock(); }
  };
  roster.forEach(p => { const r = roles.get(p.id); setView(p, { kind: 'pad', mode: 'tap', title: 'You control', label: r.label, sub: 'Tap when your team needs your move.', color: p.color }); });
  const missing = ROLES.filter(r => ![...roles.values()].includes(r));
  await countIn('Stock the Fridge', 'Check your phone for your move.');
  spawn();
  stage(`<div class="fridgewrap"><canvas id="cv" class="cv fridge" width="${W}" height="${Hh}"></canvas>
    <div class="roles"><div class="eyebrow">Controls</div>${roster.map(p => `<div class="role" id="role-${p.id}" style="--c:${p.color}"><b>${roles.get(p.id).label}</b><span>${esc(p.name)}</span></div>`).join('')}
    ${missing.length ? `<p class="muted">No one has ${missing.map(m => m.label).join(', ')}. Gravity does the dropping.</p>` : ''}
    <div class="fstat"><span id="fl">0</span> shelves<br><span id="ft">120</span>s left</div></div></div>`);
  const cv = $('#cv'), c = cv.getContext('2d'), fl = $('#fl'), ft = $('#ft');
  const cell = (x, y, col) => { c.fillStyle = col; c.beginPath(); c.roundRect(x * CELL + 3, y * CELL + 3, CELL - 6, CELL - 6, 10); c.fill(); c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(x * CELL + 10, y * CELL + 9, CELL - 30, 5); };
  await runLoop(dt => {
    time -= dt; acc += dt;
    const speed = Math.max(0.22, 0.8 - lines * 0.03);
    if (acc >= speed) { acc = 0; if (fits(piece.m, piece.x, piece.y + 1)) piece.y++; else lock(); }
    c.fillStyle = '#e9edf7'; c.fillRect(0, 0, W, Hh);
    c.strokeStyle = '#c9d0e4'; c.lineWidth = 2;
    for (let y = 1; y < ROWS; y++) if (y % 2 === 0) { c.beginPath(); c.moveTo(0, y * CELL); c.lineTo(W, y * CELL); c.stroke(); }
    grid.forEach((row, y) => row.forEach((col, x) => col && cell(x, y, col)));
    if (piece && !over) piece.m.forEach((row, j) => row.forEach((v, i) => v && cell(piece.x + i, piece.y + j, piece.c)));
    fl.textContent = lines; ft.textContent = Math.ceil(Math.max(0, time));
    return over || time <= 0;
  });
  H.onInput = null;
  roster.forEach(p => p.score = lines);
  const rec = bestRecord('fridge', lines);
  stage(`<div class="eyebrow">${over ? 'The fridge overflowed!' : 'Time\'s up'}</div><div class="bignum">${lines}</div><h2 style="font-size:2em">${lines === 1 ? 'shelf' : 'shelves'} stocked · ${rec.isNew ? 'New best on this screen!' : `Best on this screen: ${rec.best}`}</h2>`);
  roster.forEach(p => waitView(p, `Your team stocked ${lines} ${lines === 1 ? 'shelf' : 'shelves'}.`));
  await hostNext('Back to menu');
}

/* =========================================================
   PHONE
   ========================================================= */
let P = null;
function startPhone(code) {
  document.body.className = 'phone';
  let token = store.get('couchriot-token');
  if (!token) { token = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('couchriot-token', token); }
  P = { code, token, name: store.get('couchriot-name') || '', color: null, joined: false, status: 'connecting', view: null, sel: new Set(), draft: '' };
  app.innerHTML = `<div class="phone-app"><div class="phead"><div class="me" id="me"></div><div class="status" id="status"></div></div><div class="pbody" id="pbody"></div></div>`;
  P.tx = phoneTransport(code, onPhoneMsg, s => {
    P.status = s;
    if (s === 'open' && P.name && P.wantJoin !== false) P.tx.send({ t: 'join', name: P.name, token: P.token });
    renderPhone();
  });
  renderPhone();
}
function phoneTransport(code, onMsg, onStatus) {
  if (LOCAL) {
    const cid = 'c' + Math.random().toString(36).slice(2, 9);
    const bc = new BroadcastChannel(PREFIX + code);
    bc.onmessage = e => { const m = e.data; if (m.to === cid) onMsg(m.data); };
    setTimeout(() => onStatus('open'), 0);
    return { send: d => bc.postMessage({ to: 'host', from: cid, data: d }) };
  }
  if (RELAY) {
    let ws = null;
    const connect = () => {
      onStatus('connecting');
      ws = new WebSocket(relayWs(code, 'role=player'));
      ws.onopen = () => onStatus('open');
      ws.onmessage = e => {
        if (e.data === 'pong') return;
        let m; try { m = JSON.parse(e.data); } catch { return; }
        if (m.t === '_nohost') { onStatus('nohost'); return; }
        if (m.t === '_hostback') { onStatus('open'); return; }
        onMsg(m);
      };
      ws.onclose = () => { onStatus('lost'); setTimeout(connect, 1500); };
    };
    connect();
    setInterval(() => { if (ws && ws.readyState === 1) ws.send('ping'); }, 20000);
    return { send: d => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(d)); } };
  }
  if (typeof Peer === 'undefined') { setTimeout(() => onStatus('nolib'), 0); return { send() {} }; }
  let conn = null, gen = 0;
  const peer = new Peer();
  const connect = () => {
    const g = ++gen;
    onStatus('connecting');
    conn = peer.connect(PREFIX + code, { reliable: true });
    conn.on('open', () => g === gen && onStatus('open'));
    conn.on('data', d => g === gen && onMsg(d));
    conn.on('close', () => { if (g === gen) { onStatus('lost'); setTimeout(connect, 1500); } });
  };
  peer.on('open', connect);
  peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
  peer.on('error', e => { if (e.type === 'peer-unavailable') { onStatus('noroom'); setTimeout(connect, 3000); } else onStatus('error'); });
  return { send: d => { if (conn && conn.open) conn.send(d); } };
}
function onPhoneMsg(m) {
  if (m.t === 'welcome') { P.joined = true; P.name = m.name; P.color = m.color; store.set('couchriot-name', m.name); }
  else if (m.t === 'taken') { P.joined = false; P.error = 'Someone in this room already has that name. Pick another.'; P.wantJoin = false; }
  else if (m.t === 'full') { P.joined = false; P.error = 'This room is full (12 players).'; P.wantJoin = false; }
  else if (m.t === 'pad') {
    P.padText = m;
    const el = $('#padStatus');
    if (el) { el.textContent = m.text; el.style.setProperty('--c', m.color); }
    if (navigator.vibrate && /CAUGHT|BOOM/.test(m.text)) { try { navigator.vibrate(200); } catch {} }
    return;
  }
  else if (m.t === 'view') {
    const v = m.v;
    if (v.kind === 'pad' && (!P.view || P.view.kind !== 'pad')) P.padText = null;
    if (!P.view || v.rid !== P.view.rid || v.kind !== P.view.kind) { P.sel = new Set(); P.draft = ''; }
    P.view = v;
  }
  renderPhone();
}
function answer(value) { P.tx.send({ t: 'ans', rid: P.view.rid, value }); P.view = { kind: 'wait', msg: 'Sending…' }; renderPhone(); }

function renderPhone() {
  const st = { connecting: 'Connecting…', open: 'Connected', lost: 'Reconnecting…', noroom: 'Room not found, retrying…', nohost: 'Waiting for the host screen…', error: 'Connection error', nolib: 'Could not load' }[P.status] || '';
  $('#status').textContent = `Room ${P.code} · ${st}`;
  $('#status').className = 'status' + (P.status === 'open' ? '' : ' bad');
  $('#me').innerHTML = P.joined ? `<i style="--c:${P.color}"></i>${esc(P.name)}` : '<span class="muted">Couch Riot</span>';
  const body = $('#pbody');
  if (P.status === 'nolib') { body.innerHTML = `<h1>Couldn't connect</h1><p class="psub">The connection library didn't load. Check your internet and reload.</p>`; return; }
  if (!P.joined) {
    if (document.activeElement?.id === 'nameIn') return;
    body.innerHTML = `<h1>Join room ${esc(P.code)}</h1>${P.error ? `<p class="psub" style="color:var(--tang)">${esc(P.error)}</p>` : ''}
      <form id="nameForm" style="display:grid;gap:12px"><input id="nameIn" maxlength="14" placeholder="Your name" value="${esc(P.name)}" autocomplete="nickname" aria-label="Your name">
      <button class="btn" type="submit" ${P.status !== 'open' ? 'disabled' : ''}>Join</button></form>`;
    $('#nameForm').onsubmit = e => { e.preventDefault(); const n = $('#nameIn').value.trim(); if (!n) return; P.name = n; P.error = ''; P.wantJoin = true; $('#nameIn').blur(); P.tx.send({ t: 'join', name: n, token: P.token }); };
    return;
  }
  const v = P.view || { kind: 'wait', msg: 'Waiting for the host…' };
  if (v.kind === 'wait') {
    body.innerHTML = `<div class="pwait"><div class="dot" style="--c:${P.color}"></div><h1>${esc(v.msg)}</h1></div>`;
  } else if (v.kind === 'choose') {
    body.innerHTML = `<h1>${esc(v.prompt)}</h1>${v.sub ? `<p class="psub">${esc(v.sub)}</p>` : ''}
      <div class="opts">${v.options.map((o, i) => `<button class="opt" data-i="${i}" ${o.color ? `style="--c:${o.color}"` : ''}>${o.color ? '<i></i>' : ''}<span>${esc(o.label)}</span></button>`).join('')}</div>`;
    body.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(v.options[b.dataset.i].id));
  } else if (v.kind === 'text') {
    if (document.activeElement?.id === 'txt' && P.renderedRid === v.rid) return;
    P.renderedRid = v.rid;
    body.innerHTML = `<h1>${esc(v.prompt)}</h1>${v.sub ? `<p class="psub" style="white-space:pre-line">${esc(v.sub)}</p>` : ''}
      <form id="tf" style="display:grid;gap:10px"><textarea id="txt" rows="4" maxlength="${v.max || 140}" placeholder="${esc(v.placeholder || '')}" aria-label="Your answer">${esc(P.draft)}</textarea>
      <div class="counter" id="cnt"></div><button class="btn" type="submit">Send</button></form>`;
    const t = $('#txt'), cnt = $('#cnt');
    const upd = () => { P.draft = t.value; cnt.textContent = `${t.value.length} / ${v.max || 140}`; };
    t.oninput = upd; upd();
    $('#tf').onsubmit = e => { e.preventDefault(); const val = t.value.trim(); if (!val) return; t.blur(); answer(val); };
  } else if (v.kind === 'multi') {
    body.innerHTML = `<h1>${esc(v.prompt)}</h1>${v.sub ? `<p class="psub">${esc(v.sub)}</p>` : ''}
      <div class="opts">${v.items.map((it, i) => `<button class="opt ${P.sel.has(i) ? 'sel' : ''}" data-i="${i}" aria-pressed="${P.sel.has(i)}"><span class="box">${P.sel.has(i) ? '✓' : ''}</span><span>${esc(it)}</span></button>`).join('')}</div>
      <button class="btn" id="msub">Lock in ${P.sel.size} ${P.sel.size === 1 ? 'confession' : 'confessions'}</button>`;
    body.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const i = +b.dataset.i; P.sel.has(i) ? P.sel.delete(i) : P.sel.add(i);
      const on = P.sel.has(i); b.classList.toggle('sel', on); b.setAttribute('aria-pressed', on); b.querySelector('.box').textContent = on ? '✓' : '';
      $('#msub').textContent = `Lock in ${P.sel.size} ${P.sel.size === 1 ? 'confession' : 'confessions'}`;
    });
    $('#msub').onclick = () => answer([...P.sel]);
  } else if (v.kind === 'pad') {
    if (P.padRendered === v && $('#padBtn')) return;
    P.padRendered = v;
    const st = P.padText;
    body.innerHTML = `<div class="pad"><div class="eyebrow">${esc(v.title || '')}</div>
      <div class="padstatus" id="padStatus" style="--c:${st ? st.color : 'var(--line)'}">${esc(st ? st.text : 'Get ready…')}</div>
      <button class="padbtn" id="padBtn" style="--c:${v.color || 'var(--tang)'}">${esc(v.label)}</button>
      ${v.sub ? `<p class="psub">${esc(v.sub)}</p>` : ''}</div>`;
    const btn = $('#padBtn');
    let down = false;
    const press = e => { e.preventDefault(); if (down) return; down = true; try { btn.setPointerCapture(e.pointerId); } catch {} btn.classList.add('down'); P.tx.send({ t: 'in', v: 1 }); };
    const release = e => { if (!down) return; down = false; btn.classList.remove('down'); P.tx.send({ t: 'in', v: 0 }); };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('lostpointercapture', release);
    btn.addEventListener('contextmenu', e => e.preventDefault());
  } else if (v.kind === 'bingo') {
    const n = v.marked.filter(Boolean).length;
    body.innerHTML = `<h1>${esc(v.title)}</h1><p class="psub">${n} of 9 marked. Three in a row wins.</p>
      <div class="pgrid">${v.cells.map((c, i) => `<div class="${v.marked[i] ? 'on' : ''}">${esc(c)}</div>`).join('')}</div>`;
  }
}

/* ---------------- Boot ---------------- */
if (ROOM) startPhone(ROOM);
else if (PARAMS.has('host')) startHost();
else showChooser();
</script>
