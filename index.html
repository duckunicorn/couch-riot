/* ---------------- Game: Kangaroo Court ---------------- */
async function runCourt(roster) {
  await intro('Kangaroo Court', 'One player stands trial for an absurd crime. Everyone else submits evidence and witness testimony. The defendant has to explain each exhibit out loud. Then the jury decides. Getting acquitted is worth 3, and every vote for the most damning evidence is worth 1.');
  const defendants = shuffle(roster).slice(0, Math.min(roster.length, 4));
  const crimes = draw('crimes', defendants.length).map(i => i.text);
  for (const [i, d] of defendants.entries()) {
    const crime = crimes[i];
    stage(`<div class="eyebrow">Case ${i + 1} of ${defendants.length} · The People v. ${esc(d.name)}</div><h1 class="big">${esc(crime)}</h1><p class="sub">The prosecution is preparing evidence.</p>`);
    const ev = await collect(roster, p => p === d
      ? { kind: 'text', prompt: 'You are on trial', sub: `Charge: ${crime}. Enter your plea, then defend yourself out loud.`, max: 100, placeholder: 'Not guilty, because…' }
      : { kind: 'text', prompt: `Evidence against ${d.name}`, sub: `Charge: ${crime}. Write evidence or witness testimony.`, max: 140, placeholder: 'Exhibit A: …' },
      { seconds: 60, after: 'Submitted to the court.' });
    const plea = String(ev.get(d.id) || '').trim();
    const exhibits = shuffle(roster.filter(p => p !== d && String(ev.get(p.id) || '').trim()).map(p => ({ p, text: String(ev.get(p.id)).trim() })));
    roster.forEach(p => waitView(p, p === d ? 'Defend yourself out loud!' : `Watch ${d.name} squirm. Objections are encouraged.`));
    if (plea) { stage(`<div class="eyebrow">The defendant's plea</div><h1 class="big quote">${esc(plea)}</h1><p class="sub">${esc(d.name)}, you may begin.</p>`); await hostNext('First exhibit'); }
    for (const [j, x] of exhibits.entries()) {
      stage(`<div class="eyebrow">Exhibit ${letter(j)} · The People v. ${esc(d.name)}</div><h1 class="big quote">${esc(x.text)}</h1><p class="sub">${esc(d.name)}, explain yourself.</p>`);
      say(`Exhibit ${letter(j)}. ${x.text}`);
      await hostNext(j < exhibits.length - 1 ? 'Next exhibit' : 'Closing argument');
    }
    stage(`<div class="eyebrow">Closing argument</div><h1 class="big">${esc(d.name)}, you have 30 seconds.</h1><p class="sub">Charge: ${esc(crime)}</p>`);
    await timer(30, 'Jury, vote');
    stage(`<div class="eyebrow">The jury deliberates</div><h1 class="big">Guilty or not guilty?</h1>`);
    const verdict = await collect(roster.filter(p => p !== d), () => ({ kind: 'choose', prompt: `Is ${d.name} guilty?`, sub: crime, options: [{ id: 'g', label: 'GUILTY' }, { id: 'n', label: 'Not guilty' }] }), { seconds: 25 });
    const g = [...verdict.values()].filter(v => v === 'g').length, guilty = g > verdict.size / 2;
    if (!guilty) d.score += 3;
    let best = '';
    if (exhibits.length > 1) {
      stage(`<div class="eyebrow">${guilty ? 'GUILTY' : 'NOT GUILTY'}</div><h1 class="big">Most damning evidence?</h1><div class="deflist">${exhibits.map((x, j) => `<div class="def"><span class="dl">${letter(j)}</span><span>${esc(x.text)}</span></div>`).join('')}</div>`);
      const bv = await collect(roster, p => { const opts = exhibits.map((x, j) => ({ id: j, label: x.text, mine: x.p === p })).filter(o => !o.mine); return opts.length ? { kind: 'choose', prompt: 'Most damning evidence?', options: opts.map(({ id, label }) => ({ id, label })) } : null; }, { seconds: 25 });
      const t = exhibits.map((_, j) => [...bv.values()].filter(v => v === j).length);
      exhibits.forEach((x, j) => x.p.score += t[j]);
      const top = Math.max(...t), bj = t.indexOf(top);
      if (top > 0) best = `<p class="sub">Most damning: "${esc(exhibits[bj].text)}" by ${nameList([exhibits[bj].p])}</p>`;
    }
    stage(`<div class="eyebrow">The People v. ${esc(d.name)}</div><div class="bignum ${guilty ? 'boom' : ''}" style="font-size:clamp(50px,8vw,180px)">${guilty ? 'GUILTY' : 'NOT GUILTY'}</div>
      <p class="sub">${g} of ${verdict.size} jurors said guilty.${guilty ? '' : ` ${esc(d.name)} walks free with 3 points.`}</p>${best}`);
    roster.forEach(p => waitView(p, p === d ? (guilty ? 'GUILTY. Take it up with the appeals court.' : 'NOT GUILTY. You walk free.') : `Verdict: ${guilty ? 'guilty' : 'not guilty'}.`));
    await hostNext(i < defendants.length - 1 ? 'Next case' : 'Final standings');
  }
  await leaderboard(roster, 'Best lawyer');
}

/* ---------------- Game: Sequel Bracket ---------------- */
async function runSequel(roster) {
  await intro('Sequel Bracket', 'Two premises get smashed together. Everyone pitches the movie with a title and a tagline. Then the pitches battle head to head until one gets made. Every vote is worth 1, and the champion gets 3 more.');
  const [a, b] = draw('premises', 2).map(i => i.text);
  const premise = `${cap(a)} meets ${b}`;
  stage(`<div class="eyebrow">The studio wants</div><h1 class="big quote">${esc(premise)}</h1><p class="sub">Pitch it on your phone: a title and a tagline.</p>`);
  const res = await collect(roster, () => ({ kind: 'text', prompt: premise, sub: 'Pitch it: Title, then a tagline.', max: 140, placeholder: 'Goose Wick: This time, it\'s personal.' }), { seconds: 75, after: 'Pitch received. The executives are reading it.' });
  let entries = shuffle(roster.filter(p => String(res.get(p.id) || '').trim()).map(p => ({ p, text: String(res.get(p.id)).trim() })));
  if (!entries.length) { stage('<h1 class="big">No pitches. The studio is closing.</h1>'); await hostNext('Back to menu'); return; }
  let round = 1;
  while (entries.length > 1) {
    const next = [];
    if (entries.length % 2) next.push(entries.pop());
    for (let i = 0; i < entries.length; i += 2) {
      const x = entries[i], y = entries[i + 1];
      const vsHtml = (cx, cy, win) => `<div class="eyebrow">${entries.length === 2 && !next.length ? 'The final' : `Round ${round}`} · ${esc(premise)}</div>
        <div class="vs"><div class="pitch ${win === x ? 'win' : win ? 'lose' : ''}"><b>${esc(x.text)}</b>${win ? `<small>${nameList([x.p])} · ${cx} ${cx === 1 ? 'vote' : 'votes'}</small>` : ''}</div>
        <div class="vsmark">VS</div>
        <div class="pitch ${win === y ? 'win' : win ? 'lose' : ''}"><b>${esc(y.text)}</b>${win ? `<small>${nameList([y.p])} · ${cy} ${cy === 1 ? 'vote' : 'votes'}</small>` : ''}</div></div>`;
      stage(vsHtml());
      const v = await collect(roster, p => ({ kind: 'choose', prompt: 'Which movie gets made?', sub: (p === x.p || p === y.p) ? 'One of these is yours, so your vote doesn\'t count. Pick anything.' : premise, options: [{ id: 0, label: x.text }, { id: 1, label: y.text }] }), { seconds: 25 });
      v.delete(x.p.id); v.delete(y.p.id);
      const cx = [...v.values()].filter(k => k === 0).length, cy = [...v.values()].filter(k => k === 1).length;
      x.p.score += cx; y.p.score += cy;
      const win = cx > cy ? x : cy > cx ? y : pick([x, y], 1)[0];
      stage(vsHtml(cx, cy, win) + (cx === cy ? '<p class="sub">Tie! A coin flip decided it.</p>' : ''));
      next.push(win);
      await hostNext('Next matchup');
    }
    entries = shuffle(next); round++;
  }
  const champ = entries[0]; champ.p.score += 3;
  stage(`<div class="eyebrow">Greenlit · ${esc(premise)}</div><h1 class="big quote">${esc(champ.text)}</h1><div class="winner" style="--c:${champ.p.color}">Pitched by ${esc(champ.p.name)}</div>`);
  roster.forEach(p => waitView(p, p === champ.p ? 'Your movie got made! +3' : `${champ.p.name}'s movie got made.`));
  await hostNext('Final standings');
  await leaderboard(roster, 'Hottest producer');
}

/* ---------------- Game: Fermi Bets ---------------- */
async function runFermi(roster) {
  await intro('Fermi Bets', 'Guess a number. Then bet on whichever guess you think is closest, your own included. The closest guess earns 3, and betting on it earns 2.');
  const qs = draw('fermi', 5, it => { const s = splitEq(it.text); return !!s && Number.isFinite(parseNum(s.a)); }).map(i => { const s = splitEq(i.text); return { q: s.q, ans: parseNum(s.a), author: i.author }; });
  for (const [r, q] of qs.entries()) {
    stage(`<div class="eyebrow">Question ${r + 1} of ${qs.length}</div><h1 class="big">${esc(q.q)}</h1><p class="sub">Guess on your phone.</p>`);
    const g = await collect(roster, p => ({ kind: 'text', numeric: true, prompt: q.q, sub: p === q.author ? 'You wrote this one, so your guess won\'t count. Type any number.' : 'Your best guess. Numbers only.', max: 20, placeholder: '0' }), { seconds: 40 });
    const slots = [];
    for (const p of roster) {
      if (p === q.author) continue;
      const n = parseNum(g.get(p.id)); if (!Number.isFinite(n)) continue;
      const s = slots.find(s => s.n === n); s ? s.ps.push(p) : slots.push({ n, ps: [p] });
    }
    slots.sort((a, b) => a.n - b.n);
    if (!slots.length) { stage(`<div class="eyebrow">${esc(q.q)}</div><div class="bignum">${fmtNum(q.ans)}</div><p class="sub">Nobody guessed.</p>`); await hostNext('Next question'); continue; }
    const board = (reveal, best) => `<div class="slots">${slots.map((s, i) => `<div class="slot ${reveal && best.includes(s) ? 'win' : ''}"><b>${fmtNum(s.n)}</b><span>${nameList(s.ps)}</span>${reveal ? `<small>${((n) => `${n} ${n === 1 ? "bet" : "bets"}`)([...bets].filter(([, v]) => v === i).length)}</small>` : ''}</div>`).join('')}</div>`;
    let bets = new Map();
    stage(`<div class="eyebrow">${esc(q.q)}</div><h1 class="big" style="font-size:clamp(26px,3vw,64px)">Place your bets</h1>${board(false, [])}`);
    bets = await collect(roster, () => ({ kind: 'choose', prompt: 'Which guess is closest?', sub: q.q, options: slots.map((s, i) => ({ id: i, label: `${fmtNum(s.n)} (${s.ps.map(p => p.name).join(', ')})` })) }), { seconds: 30 });
    const diff = s => Math.abs(s.n - q.ans), min = Math.min(...slots.map(diff));
    const best = slots.filter(s => diff(s) === min);
    best.forEach(s => s.ps.forEach(p => p.score += 3));
    for (const [pid, v] of bets) if (byId(pid) !== q.author && best.includes(slots[v])) byId(pid).score += 2;
    stage(`<div class="eyebrow">${esc(q.q)}</div><div class="bignum">${fmtNum(q.ans)}</div>${board(true, best)}`);
    await hostNext(r < qs.length - 1 ? 'Next question' : 'Final standings');
  }
  await leaderboard(roster, 'Best estimator');
}

/* ---------------- Game: Wrong Answers Only ---------------- */
async function runWrong(roster) {
  await intro('Wrong Answers Only', 'Easy trivia, but only wrong answers allowed. Vote for the funniest wrong answer. Every vote is worth 1. Accidentally getting it right costs you a point.');
  const qs = draw('trivia', 5, it => !!splitEq(it.text)).map(i => { const s = splitEq(i.text); return { q: s.q, alts: s.a.split('|').map(x => x.trim()).filter(Boolean) }; });
  const isRight = (ans, alts) => { const a = ' ' + norm(ans) + ' '; return alts.some(al => { const n = norm(al); return n && a.includes(' ' + n + ' '); }); };
  for (const [r, q] of qs.entries()) {
    stage(`<div class="eyebrow">Question ${r + 1} of ${qs.length}</div><h1 class="big">${esc(q.q)}</h1><p class="sub">Wrong answers only.</p>`);
    const ans = await collect(roster, () => ({ kind: 'text', prompt: q.q, sub: 'Wrong answers only. Make it funny.', max: 80 }), { seconds: 40 });
    const oops = [], entries = [];
    for (const p of roster) {
      const t = String(ans.get(p.id) || '').trim(); if (!t) continue;
      if (isRight(t, q.alts)) { p.score -= 1; oops.push(p); continue; }
      if (entries.some(e => norm(e.text) === norm(t))) continue;
      entries.push({ p, text: t });
    }
    const list = shuffle(entries);
    stage(`<div class="eyebrow">${esc(q.q)}</div><h1 class="big" style="font-size:clamp(26px,3vw,64px)">Funniest wrong answer?</h1><div class="deflist">${list.map((e, i) => `<div class="def"><span class="dl">${letter(i)}</span><span>${esc(e.text)}</span></div>`).join('')}</div>`);
    const votes = list.length ? await collect(roster, p => { const o = list.map((e, i) => ({ id: i, label: e.text, mine: e.p === p })).filter(o => !o.mine); return o.length ? { kind: 'choose', prompt: 'Funniest wrong answer?', sub: q.q, options: o.map(({ id, label }) => ({ id, label })) } : null; }, { seconds: 30 }) : new Map();
    const t = list.map((_, i) => [...votes.values()].filter(v => v === i).length);
    list.forEach((e, i) => e.p.score += t[i]);
    const order = list.map((e, i) => ({ e, n: t[i] })).sort((a, b) => b.n - a.n);
    stage(`<div class="eyebrow">${esc(q.q)} · The real answer: ${esc(q.alts[0])}</div>
      <div class="deflist">${order.map(({ e, n }, i) => `<div class="def ${i === 0 && n ? 'real' : ''}"><span class="dl">${n}</span><span>${esc(e.text)}<small>${nameList([e.p])}</small></span></div>`).join('')}</div>
      ${oops.length ? `<p class="sub">Accidentally correct, −1: ${nameList(oops)}</p>` : ''}`);
    await hostNext(r < qs.length - 1 ? 'Next question' : 'Final standings');
  }
  await leaderboard(roster, 'Most creatively wrong');
}

/* ---------------- Game: Sync or Sink ---------------- */
async function runSync(roster) {
  await intro('Sync or Sink', 'A beat plays on the big screen. Tap your phone on every beat. You are scored on how steady you are, so phone lag doesn\'t count against you. Three rounds, each one faster.');
  let actx = null;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); actx.resume?.(); } catch {}
  H.cleanup.push(() => { try { actx && actx.close(); } catch {} });
  const click = accent => {
    if (!actx) return;
    try { const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime; o.frequency.value = accent ? 1320 : 880; g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.1); } catch {}
  };
  const COUNT_IN = 4, SCORED = 16;
  for (let r = 0; r < 3; r++) {
    const bpm = [84, 108, 132][r];
    roster.forEach(p => setView(p, { kind: 'pad', mode: 'tap', title: `Round ${r + 1} of 3 · ${bpm} BPM`, label: 'TAP', sub: 'Tap on every beat. Steady beats perfect.', color: p.color }));
    const taps = new Map(roster.map(p => [p.id, []]));
    const flashDot = p => { const el = document.getElementById('sd-' + p.id); if (el) { el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); } };
    H.onInput = (p, v) => { if (v && taps.has(p.id)) { taps.get(p.id).push(performance.now()); flashDot(p); } };
    stage(`<div class="sync"><div class="eyebrow" id="synclbl">Round ${r + 1} of 3 · ${bpm} BPM · count-in</div><div class="beat" id="beat"></div>
      <div class="syncdots">${roster.map(p => `<span class="sdot" id="sd-${p.id}" style="--c:${p.color}">${esc(p.name)}</span>`).join('')}</div></div>`);
    const beatEl = $('#beat'), lbl = $('#synclbl');
    let interval = 60000 / bpm, next = performance.now() + 900, idx = 0; const beats = [];
    await runLoop((dt, now) => {
      if (now >= next) {
        beats.push(next); click(idx % 4 === 0);
        beatEl.classList.remove('pulse'); void beatEl.offsetWidth; beatEl.classList.add('pulse');
        beatEl.textContent = idx < COUNT_IN ? String(COUNT_IN - idx) : '';
        if (idx === COUNT_IN) lbl.textContent = `Round ${r + 1} of 3 · ${bpm} BPM · tap!`;
        idx++;
        if (isUnhinged() && idx === COUNT_IN + 8) { interval = 60000 / (bpm + (Math.random() < 0.5 ? -1 : 1) * (18 + Math.random() * 14)); lbl.textContent = 'TEMPO CHANGE!'; padAll(roster, 'TEMPO CHANGE!', '#ff4fa3'); }
        next += interval;
      }
      return idx >= COUNT_IN + SCORED && now > beats[beats.length - 1] + interval * 0.6;
    });
    H.onInput = null;
    const scored = beats.slice(COUNT_IN);
    const results = roster.map(p => {
      const offs = [];
      for (let k = 0; k < scored.length; k++) {
        const b = scored[k], win = (k ? scored[k] - scored[k - 1] : interval) * 0.45;
        const near = taps.get(p.id).filter(t => Math.abs(t - b) <= win);
        if (near.length) offs.push(near.reduce((a, t) => Math.abs(t - b) < Math.abs(a - b) ? t : a) - b);
      }
      const sorted = [...offs].sort((a, b) => a - b), med = sorted.length ? sorted[sorted.length >> 1] : 0;
      const dev = offs.length ? offs.reduce((a, o) => a + Math.abs(o - med), 0) / offs.length : 999;
      const score = Math.round(Math.max(0, 100 - dev / 2) * offs.length / scored.length);
      p.score += score;
      return { p, score, hits: offs.length, dev };
    }).sort((a, b) => b.score - a.score);
    const max = Math.max(1, ...results.map(x => x.score));
    stage(`<div class="eyebrow">Round ${r + 1} · ${bpm} BPM</div><h2 style="font-size:2em">${results[0].score ? `${esc(results[0].p.name)} is the human metronome` : 'Total chaos'}</h2>
      <div class="bars">${results.map(x => `<div class="bar" style="--c:${x.p.color}"><span>${esc(x.p.name)}</span><div class="track"><div class="fill" data-w="${x.score / max * 100}"></div></div><span class="n">${x.score}</span></div>`).join('')}</div>
      <p class="sub">Hits out of ${scored.length}: ${results.map(x => `${esc(x.p.name)} ${x.hits}`).join(' · ')}</p>`);

const HECKLES = ['😂', '💀', '🔥', '🤮', '🍅', '😱'];
function say(text, interrupt = true) {
  if (!H || !H.settings || !H.settings.voice || !('speechSynthesis' in window)) return;
  try {
    if (interrupt) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).slice(0, 500));
    u.rate = 1.03; u.pitch = 0.92;
    speechSynthesis.speak(u);
  } catch {}
}
function heckle(p, e) {
  const now = Date.now(); if (now - (p.lastHeckle || 0) < 220) return; p.lastHeckle = now;
  const em = HECKLES[e | 0], layer = $('#heckles');
  if (!em || !layer || layer.childElementCount > 70) return;
  const s = document.createElement('span');
  s.className = 'hk'; s.textContent = em;
  s.style.left = (3 + Math.random() * 92) + '%';
  s.style.fontSize = (2.4 + Math.random() * 2.2) + 'em';
  s.style.setProperty('--dx', ((Math.random() - .5) * 220) + 'px');
  s.style.setProperty('--rot', ((Math.random() - .5) * 80) + 'deg');
  layer.appendChild(s); setTimeout(() => s.remove(), 2700);
}

/* ---------------- Game: Broken Telephone ---------------- */
async function runTelephone(roster) {
  await intro('Broken Telephone', 'Everyone writes a sentence. The next person draws it. The next person describes the drawing without seeing the sentence, the next draws that, and so on. Then we watch it all fall apart.');
  const n = roster.length, steps = Math.min(Math.max(n, 4), 8), W = 600, Hh = 450;
  const order = shuffle(roster), chains = order.map(() => []);
  const ideas = draw('drawprompts', n).map(i => i.text);
  const idea = i => ideas[i] || 'A goose filing its taxes';
  const drawSecs = isUnhinged() ? 45 : 80;
  for (let k = 0; k < steps; k++) {
    const isDraw = k % 2 === 1, chainOf = p => (order.indexOf(p) - k + n * 8) % n;
    stage(`<div class="eyebrow">Step ${k + 1} of ${steps}${isUnhinged() && isDraw ? ' · speed round' : ''}</div>
      <h1 class="big">${k === 0 ? 'Write something to draw' : isDraw ? 'Draw what you read' : 'Describe what you see'}</h1>
      <p class="sub">${k === 0 ? 'Weird is good. Horrible is better.' : isDraw ? 'Everyone only sees the step right before theirs.' : 'No peeking at the original. You only get the drawing.'}</p>`);
    const res = await collect(order, p => {
      const c = chainOf(p), prev = chains[c][k - 1];
      if (k === 0) return { kind: 'text', prompt: 'Write a sentence for someone to draw', sub: 'Make it weird. The worse the better.', max: 100, placeholder: idea(order.indexOf(p)) };
      if (isDraw) return { kind: 'draw', prompt: 'Draw this:', sub: prev.text, w: W, h: Hh };
      return { kind: 'text', prompt: 'What is this?', sub: 'Describe this drawing in one sentence.', max: 100, image: prev.d.strokes, iw: W, ih: Hh };
    }, { seconds: k === 0 ? 60 : isDraw ? drawSecs : 45, after: 'Passed along. Good luck to the next person.' });
    order.forEach(p => {
      const c = chainOf(p), v = res.get(p.id);
      if (isDraw) chains[c][k] = { type: 'draw', d: cleanDrawing(v), by: p };
      else {
        let t = String(v || '').trim().slice(0, 100);
        if (!t) t = k === 0 ? idea(order.indexOf(p)) : '(they panicked and wrote nothing)';
        chains[c][k] = { type: 'text', text: t, by: p };
      }
    });
  }
  const item = (it, id, k) => it.type === 'text'
    ? `<div class="tstep"><div class="eyebrow" style="color:${it.by.color}">${esc(it.by.name)} ${k === 0 ? 'wrote' : 'thinks it\'s'}</div><div class="tbubble">${esc(it.text)}</div></div>`
    : `<div class="tstep"><div class="eyebrow" style="color:${it.by.color}">${esc(it.by.name)} drew</div><canvas id="${id}" class="sketch" width="${W}" height="${Hh}"></canvas></div>`;
  const paintIf = (it, id) => it && it.type === 'draw' && paint(id, W, Hh, [{ d: it.d }]);
  for (let c = 0; c < n; c++) {
    const ch = chains[c];
    for (let k = 0; k < steps; k++) {
      const prev = ch[k - 1], cur = ch[k];
      stage(`<div class="eyebrow">Chain ${c + 1} of ${n} · started by ${esc(ch[0].by.name)} · step ${k + 1} of ${steps}</div>
        <div class="tpair">${prev ? item(prev, 'tp0', k - 1) : ''}${item(cur, 'tp1', k)}</div>`);
      paintIf(prev, 'tp0'); paintIf(cur, 'tp1');
      if (cur.type === 'text') say(k === 0 ? `${cur.by.name} wrote: ${cur.text}` : `${cur.by.name} thinks this is: ${cur.text}`);
      await hostNext(k < steps - 1 ? 'Next' : 'How it ended');
    }
    const first = ch[0], last = ch[steps - 1];
    stage(`<div class="eyebrow">Chain ${c + 1} · how it started vs. how it ended</div>
      <div class="tpair">${item(first, 'tp0', 0)}${item(last, 'tp1', steps - 1)}</div>
      <div class="tstrip">${ch.map((it, i) => it.type === 'text' ? `<span class="tchip" style="--c:${it.by.color}">${esc(it.text)}</span>` : `<canvas id="ts-${i}" class="tmini" width="${W}" height="${Hh}"></canvas>`).join('<span class="muted">→</span>')}</div>`);
    paintIf(last, 'tp1'); ch.forEach((it, i) => paintIf(it, 'ts-' + i));
    say(`It started as: ${first.text}. ${last.type === 'text' ? 'And it ended as: ' + last.text : 'And it ended as whatever that is.'}`);
    await hostNext(c < n - 1 ? 'Next chain' : 'Awards');
  }
  stage(`<div class="eyebrow">Awards</div><h1 class="big">Who ruined everything?</h1><p class="sub">Vote on your phone: best artist, and the person who derailed the most chains.</p>`);
  const others = p => roster.filter(o => o !== p).map(o => ({ id: o.id, label: o.name, color: o.color }));
  const art = await collect(roster, p => ({ kind: 'choose', prompt: 'Best artist?', options: others(p) }), { seconds: 25 });
  const ruin = await collect(roster, p => ({ kind: 'choose', prompt: 'Who derailed things the most?', options: others(p) }), { seconds: 25 });
  const count = (m, id) => [...m.values()].filter(v => v === id).length;
  roster.forEach(p => p.score += 2 * count(art, p.id) + count(ruin, p.id));
  const topOf = m => { const t = roster.map(p => [p, count(m, p.id)]), mx = Math.max(...t.map(x => x[1])); return mx ? t.filter(x => x[1] === mx).map(x => x[0]) : []; };
  const ba = topOf(art), br = topOf(ruin);
  stage(`<div class="eyebrow">Awards</div>
    <div class="titlewall"><div class="tcard" style="--c:var(--butter)"><h3>Best artist</h3><div>${ba.length ? nameList(ba) : 'Nobody'}</div><span class="muted">2 points per vote</span></div>
    <div class="tcard" style="--c:var(--tang)"><h3>Agent of chaos</h3><div>${br.length ? nameList(br) : 'Nobody'}</div><span class="muted">1 point per vote</span></div></div>`);
  await hostNext('Final standings');
  await leaderboard(roster, 'Telephone legend');
}

/* ---------------- Game: Quip Clash ---------------- */
async function runQuips(roster) {
  await intro('Quip Clash', 'You get two prompts, and someone else gets each one too. Be funnier than them. The room votes on every matchup. Round 2 is worth double, and in the final round everyone answers the same prompt.');
  const n = roster.length;
  const showMatch = (pr, L, R, res) => `<div class="eyebrow">${esc(pr.head)}</div><h1 class="big" style="font-size:clamp(26px,3.2vw,76px)">${esc(pr.text)}</h1>
    <div class="vs"><div class="pitch ${res ? (res.win === L ? 'win' : 'lose') : ''}"><b>${esc(L.a || '(no answer)')}</b>${res ? `<small>${nameList([L.p])} · ${res.pct(L)}%</small>` : ''}</div>
    <div class="vsmark">VS</div>
    <div class="pitch ${res ? (res.win === R ? 'win' : 'lose') : ''}"><b>${esc(R.a || '(no answer)')}</b>${res ? `<small>${nameList([R.p])} · ${res.pct(R)}%</small>` : ''}</div></div>
    ${res && res.note ? `<h2 style="font-size:2.2em;color:var(--butter)">${res.note}</h2>` : ''}`;
  for (let round = 1; round <= 2; round++) {
    const order = shuffle(roster), prompts = draw('quips', n).map(i => i.text);
    stage(`<div class="eyebrow">Round ${round} of 3${round === 2 ? ' · double points' : ''}</div><h1 class="big">Answer your two prompts</h1><p class="sub">Somebody else got the same prompt. Be worse than them, but funnier.</p>`);
    const res = await collect(order, p => { const i = order.indexOf(p); return { kind: 'texts', prompt: 'Your prompts', sub: 'Short and horrible wins.', items: [i, (i - 1 + n) % n].map(m => ({ prompt: prompts[m], max: 80 })) }; }, { seconds: 90, after: 'Locked in. Let\'s see who wins.' });
    const ans = (p, m) => { const i = order.indexOf(p), arr = Array.isArray(res.get(p.id)) ? res.get(p.id) : []; return String(arr[m === i ? 0 : 1] || '').trim().slice(0, 80); };
    for (let m = 0; m < n; m++) {
      const a = order[m], b = order[(m + 1) % n];
      const pair = shuffle([{ p: a, a: ans(a, m) }, { p: b, a: ans(b, m) }]), [L, R] = pair;
      const pr = { head: `Round ${round} · matchup ${m + 1} of ${n}`, text: prompts[m] };
      stage(showMatch(pr, L, R));
      say(prompts[m]); say(L.a || 'no answer', false); say('or', false); say(R.a || 'no answer', false);
      const voters = roster.filter(p => p !== a && p !== b);
      let votes = new Map();
      const jinx = L.a && R.a && norm(L.a) === norm(R.a);
      if (!jinx && L.a && R.a) votes = await collect(voters, () => ({ kind: 'choose', prompt: pr.text, sub: 'Which is better?', options: [{ id: 0, label: L.a }, { id: 1, label: R.a }] }), { seconds: 20 });
      else await hostNext('Show result');
      const cnt = [0, 1].map(k => [...votes.values()].filter(v => v === k).length), total = cnt[0] + cnt[1];
      let win = null, note = '';
      if (jinx) note = 'JINX! Same answer. Nobody scores.';
      else if (!L.a || !R.a) { win = L.a ? L : R.a ? R : null; if (win) { win.p.score += 2 * round; note = 'Forfeit! Somebody didn\'t answer.'; } }
      else {
        L.p.score += cnt[0] * round; R.p.score += cnt[1] * round;
        win = cnt[0] > cnt[1] ? L : cnt[1] > cnt[0] ? R : null;
        if (win && total >= 2 && cnt[win === L ? 1 : 0] === 0) { win.p.score += 2 * round; note = `CLEAN SWEEP! +${2 * round} bonus for ${esc(win.p.name)}`; }
      }
      const pct = s => total ? Math.round(cnt[s === L ? 0 : 1] / total * 100) : 0;
      stage(showMatch(pr, L, R, { win, pct, note }));
      await hostNext(m < n - 1 ? 'Next matchup' : round === 1 ? 'Round 2' : 'Final round');
    }
  }
  const fp = draw('quips', 1)[0].text;
  stage(`<div class="eyebrow">Final round · everyone vs. everyone · triple points</div><h1 class="big">${esc(fp)}</h1>`);
  say(`Final round. ${fp}`);
  const fa = await collect(roster, () => ({ kind: 'text', prompt: fp, sub: 'Everyone gets this one. Triple points per vote.', max: 80 }), { seconds: 60 });
  const list = shuffle(roster.filter(p => String(fa.get(p.id) || '').trim()).map(p => ({ p, a: String(fa.get(p.id)).trim().slice(0, 80) })));
  if (list.length > 1) {
    stage(`<div class="eyebrow">Final round</div><h1 class="big" style="font-size:clamp(26px,3vw,70px)">${esc(fp)}</h1><div class="deflist">${list.map((x, i) => `<div class="def"><span class="dl">${letter(i)}</span><span>${esc(x.a)}</span></div>`).join('')}</div>`);
    list.forEach((x, i) => say(x.a, i === 0));
    const v = await collect(roster, p => { const o = list.map((x, i) => ({ id: i, label: x.a, mine: x.p === p })).filter(o => !o.mine); return o.length ? { kind: 'choose', prompt: 'Best answer?', sub: fp, options: o.map(({ id, label }) => ({ id, label })) } : null; }, { seconds: 30 });
    const t = list.map((_, i) => [...v.values()].filter(x => x === i).length);
    list.forEach((x, i) => x.p.score += 3 * t[i]);
    const ranked = list.map((x, i) => ({ x, n: t[i] })).sort((a, b) => b.n - a.n);
    stage(`<div class="eyebrow">Final round · ${esc(fp)}</div><div class="deflist">${ranked.map(({ x, n }, i) => `<div class="def ${i === 0 && n ? 'real' : ''}"><span class="dl">${n}</span><span>${esc(x.a)}<small>${nameList([x.p])} · +${3 * n}</small></span></div>`).join('')}</div>`);
    await hostNext('Final standings');
  }
  await leaderboard(roster, 'Quip champion');
}

/* ---------------- Game: Mad Libs Mayhem ---------------- */
async function runMadLibs(roster) {
  await intro('Mad Libs Mayhem', 'Fill in blanks without seeing the story. Then the story gets read out loud. Vote for the best word in it. Some blanks ask you to pick someone in this room.');
  const tpls = draw('madlibs', 3, it => /\[[^\]]+\]/.test(it.text)).map(i => i.text);
  for (const [r, tpl] of tpls.entries()) {
    const parts = tpl.split(/(\[[^\]]+\])/), blanks = [];
    parts.forEach((s, i) => { if (/^\[[^\]]+\]$/.test(s)) blanks.push({ i, type: s.slice(1, -1).trim().toLowerCase() }); });
    const ord = shuffle(roster), assign = new Map(roster.map(p => [p.id, []]));
    shuffle(blanks).forEach((b, k) => { b.by = ord[k % ord.length]; assign.get(b.by.id).push(b); });
    stage(`<div class="eyebrow">Story ${r + 1} of ${tpls.length}</div><h1 class="big">Fill in the blanks</h1><p class="sub">You have no idea where your words are going.</p>`);
    const res = await collect(roster.filter(p => assign.get(p.id).length), p => ({ kind: 'texts', prompt: 'Fill in the blanks', sub: 'You can\'t see the story. That\'s the point.',
      items: assign.get(p.id).map(b => b.type === 'someone in this room' ? { prompt: 'Someone in this room', options: roster.map(o => o.name) } : { prompt: blankLabel(b.type), max: 40 }) }), { seconds: 60, after: 'Your words are in the machine now.' });
    for (const p of roster) { const arr = Array.isArray(res.get(p.id)) ? res.get(p.id) : []; assign.get(p.id).forEach((b, k) => { let t = String(arr[k] || '').trim().slice(0, 40); if (!t) t = b.type === 'someone in this room' ? pick(roster, 1)[0].name : 'something'; b.text = t; }); }
    const html = parts.map((s, i) => { const b = blanks.find(b => b.i === i); return b ? `<mark style="--c:${b.by.color}">${esc(b.text)}</mark>` : esc(s); }).join('');

    const t = votable.map((_, k) => [...v.values()].filter(x => x === k).length);

      <div class="story small">${html}</div>`);
    await hostNext(r < tpls.length - 1 ? 'Next story' : 'Final standings');

}

/* ---------------- Game: Champion Maker ---------------- */
async function runChampions(roster) {
  await intro('Champion Maker', 'Draw and name the champion of something ridiculous. Then someone else draws a challenger to take the title. The room decides every fight. Each vote is worth 1, and holding your title is worth 2 more.');
  const n = roster.length, W = 500, Hh = 500, order = shuffle(roster);
  const titles = draw('champions', n).map(i => i.text.replace(/^(the )?champion of /i, ''));
  stage(`<div class="eyebrow">Round 1</div><h1 class="big">Draw your champion</h1><p class="sub">Check your phone for your title.</p>`);
  const c1 = await collect(order, p => ({ kind: 'draw', prompt: `The Champion of ${titles[order.indexOf(p)]}`, sub: 'Draw your champion, then give them a name.', w: W, h: Hh, ask: 'Champion name' }), { seconds: 90, after: 'Your champion awaits a challenger.' });
  const champs = order.map((p, i) => { const v = c1.get(p.id) || {}; return { title: titles[i], by: p, d: cleanDrawing(v), name: String(v.name || '').trim().slice(0, 40) || 'The Nameless One' }; });
  stage(`<div class="eyebrow">Round 2</div><h1 class="big">Draw a challenger</h1><p class="sub">You get someone else's champion. Draw something that beats it.</p>`);
  const c2 = await collect(order, p => { const ch = champs[(order.indexOf(p) + 1) % n]; return { kind: 'draw', prompt: `Defeat ${ch.name}`, sub: `Draw a challenger for the title "Champion of ${ch.title}", then name them.`, w: W, h: Hh, ask: 'Challenger name', ref: ch.d.strokes, rw: W, rh: Hh, refLabel: `The current champion: ${ch.name}` }; }, { seconds: 90, after: 'Challenger submitted. Let\'s fight.' });
  for (const [i, ch] of champs.entries()) {
    const cp = order[(i - 1 + n) % n], v = c2.get(cp.id) || {};
    const chall = { by: cp, d: cleanDrawing(v), name: String(v.name || '').trim().slice(0, 40) || 'Some Guy' };
    const fight = (res) => `<div class="eyebrow">Fight ${i + 1} of ${n}</div><h1 class="big" style="font-size:clamp(26px,3vw,70px)">The Champion of ${esc(ch.title)}</h1>
      <div class="vs"><div class="fighter ${res ? (res.w === 0 ? 'win' : res.w === 1 ? 'lose' : '') : ''}"><canvas id="fa" class="sketch" width="${W}" height="${Hh}"></canvas><h2>${esc(ch.name)}</h2>${res ? `<small>${nameList([ch.by])} · ${res.c[0]} ${res.c[0] === 1 ? 'vote' : 'votes'}</small>` : '<small>Defending champion</small>'}</div>
      <div class="vsmark">VS</div>
      <div class="fighter ${res ? (res.w === 1 ? 'win' : res.w === 0 ? 'lose' : '') : ''}"><canvas id="fb" class="sketch" width="${W}" height="${Hh}"></canvas><h2>${esc(chall.name)}</h2>${res ? `<small>${nameList([chall.by])} · ${res.c[1]} ${res.c[1] === 1 ? 'vote' : 'votes'}</small>` : '<small>Challenger</small>'}</div></div>
      ${res ? `<h2 style="font-size:2em;color:var(--butter)">${res.w === 0 ? `${esc(ch.name)} keeps the title!` : res.w === 1 ? `${esc(chall.name)} is the new champion!` : 'A draw. Nobody holds the title.'}</h2>` : ''}`;
    const paintBoth = () => { paint('fa', W, Hh, [{ d: ch.d }]); paint('fb', W, Hh, [{ d: chall.d }]); };
    stage(fight()); paintBoth();
    say(`For the title of Champion of ${ch.title}: ${ch.name}, versus, ${chall.name}!`);
    const vt = await collect(roster.filter(p => p !== ch.by && p !== cp), () => ({ kind: 'choose', prompt: `Champion of ${ch.title}?`, options: [{ id: 0, label: ch.name }, { id: 1, label: chall.name }] }), { seconds: 25 });
    const c = [0, 1].map(k => [...vt.values()].filter(x => x === k).length);
    ch.by.score += c[0]; chall.by.score += c[1];

    if (w === 0) ch.by.score += 2; else if (w === 1) chall.by.score += 2;
    stage(fight({ c, w })); paintBoth();
    say(w === 0 ? `${ch.name} keeps the title!` : w === 1 ? `${chall.name} is the new champion!` : 'A draw!');
    await hostNext(i < n - 1 ? 'Next fight' : 'Final standings');
  }
  await leaderboard(roster, 'Champion maker');
}

/* ---------------- Game: Advice From Hell ---------------- */
async function runAdvice(roster) {
  await intro('Advice From Hell', 'One player shares a problem, real or made up. Everyone else gives the worst possible advice. The person with the problem picks the advice they will follow, worth 2, and the room votes, worth 1 each.');
  const askers = shuffle(roster).slice(0, Math.min(roster.length, 5));
  const fallback = draw('problems', askers.length).map(i => i.text);
  for (const [r, asker] of askers.entries()) {
    const fb = fallback[r] || 'A goose has been following me for a week.';
    stage(`<div class="eyebrow">Letter ${r + 1} of ${askers.length}</div><h1 class="big">${esc(asker.name)} has a problem</h1><p class="sub">They're writing in now. Heckle them while you wait.</p>`);
    const q = await collect([asker], () => ({ kind: 'text', prompt: 'What\'s your problem?', sub: 'Real or made up. Everyone is about to give you terrible advice.', max: 140, placeholder: fb }), { seconds: 50 });
    const problem = String(q.get(asker.id) || '').trim().slice(0, 140) || fb;
    stage(`<div class="eyebrow">Dear Hell, from ${esc(asker.name)}</div><h1 class="big quote">${esc(problem)}</h1><p class="sub">Everyone else: write the worst advice you can.</p>`);
    say(`Dear Hell. ${problem}`);
    const others = roster.filter(p => p !== asker);
    const adv = await collect(others, () => ({ kind: 'text', prompt: 'Worst possible advice', sub: `${asker.name} says: ${problem}`, max: 140 }), { seconds: 60, after: 'Advice sent. You monster.' });
    const list = shuffle(others.filter(p => String(adv.get(p.id) || '').trim()).map(p => ({ p, text: String(adv.get(p.id)).trim().slice(0, 140) })));
    if (!list.length) { stage('<h1 class="big">Nobody had advice. Good luck out there.</h1>'); await hostNext('Next letter'); continue; }
    stage(`<div class="eyebrow">${esc(problem)}</div><div class="deflist">${list.map((x, i) => `<div class="def"><span class="dl">${letter(i)}</span><span>${esc(x.text)}</span></div>`).join('')}</div>`);
    list.forEach((x, i) => say(`${letter(i)}. ${x.text}`, i === 0));
    const v = await collect(roster, p => { const o = list.map((x, i) => ({ id: i, label: x.text, mine: x.p === p })).filter(o => !o.mine); return o.length ? { kind: 'choose', prompt: p === asker ? 'Which advice will you follow?' : 'Best terrible advice?', sub: problem, options: o.map(({ id, label }) => ({ id, label })) } : null; }, { seconds: 35 });
    const chosen = v.get(asker.id);
    const t = list.map((_, i) => [...v].filter(([pid, x]) => pid !== asker.id && x === i).length);
    list.forEach((x, i) => x.p.score += t[i] + (chosen === i ? 2 : 0));
    stage(`<div class="eyebrow">${esc(problem)}</div><div class="deflist">${list.map((x, i) => ({ x, i })).sort((a, b) => (b.i === chosen) - (a.i === chosen) || t[b.i] - t[a.i]).map(({ x, i }) => `<div class="def ${i === chosen ? 'real' : ''}"><span class="dl">${t[i]}</span><span>${esc(x.text)}<small>${nameList([x.p])}${i === chosen ? ` · ${esc(asker.name.toUpperCase())} WILL FOLLOW THIS ADVICE` : ''}</small></span></div>`).join('')}</div>`);
    if (chosen !== undefined && list[chosen]) say(`${asker.name} will follow this advice: ${list[chosen].text}`);
    await hostNext(r < askers.length - 1 ? 'Next letter' : 'Final standings');
  }
  await leaderboard(roster, 'Worst therapist');
}

function buildChoreo(track) {
  const segs = [], beatsPerBar = 4;
  const rnd = a => a[Math.random() * a.length | 0];
  const pickMoves = (pool, n) => { const out = []; let last = null; for (let i = 0; i < n; i++) { let m; do { m = rnd(pool); } while (m === last && pool.length > 1); out.push(m); last = m; } return out; };
  const cursed = () => isUnhinged() && Math.random() < 0.45;
  const chorusRoutine = [...pickMoves(DPOOLS.chorus, 3), rnd(DPOOLS.chorus), rnd(DPOOLS.gold)];
  let bar = 0;
  const add = (move, bars, extra = {}) => { for (let i = 0; i < bars; i++) segs.push({ b0: (bar + i) * beatsPerBar, n: beatsPerBar, move, ...extra }); bar += bars; };
  const verse = (bars, speed) => { const moves = pickMoves(DPOOLS.verse, bars / 2); if (cursed()) moves[moves.length * Math.random() | 0] = rnd(DPOOLS.cursed); moves.forEach(m => add(m, 2, speed ? { speed } : {})); };
  const chorus = () => { add(chorusRoutine[0], 2); add(chorusRoutine[1], 2); add(chorusRoutine[2], 2); add(chorusRoutine[3], 1); add(chorusRoutine[4], 1, { gold: true }); };
  if (track.custom) {
    const total = Math.floor(track.totalBeats / 4);
    add(rnd(DPOOLS.warm), 2);
    let phase = 0;
    while (bar + 8 <= total) { phase++ % 2 ? chorus() : verse(8, isUnhinged() && phase % 3 === 0 ? 2 : 0); }
    while (bar < total) add(rnd(DPOOLS.warm), 1);
  } else {
    for (const [sec, bars] of track.form) {
      if (sec === 'intro') { add(rnd(DPOOLS.warm), 2); add(rnd(DPOOLS.warm), 2); }
      else if (sec === 'verse') verse(bars);
      else if (sec === 'chorus') chorus();
      else if (sec === 'bridge') verse(bars, isUnhinged() ? 2 : 0);
      else if (sec === 'outro') { add(rnd(DPOOLS.gold), 1, { gold: true }); add('Hip Sway', bars - 1); }
    }
  }
  return segs;
}

function danceMusic(actx, track, t0) {

  const mtf = m => 440 * Math.pow(2, (m - 69) / 12);
  const env = (g, t, a, peak, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };

  const nz = (t, type, freq, peak, d, q = 1) => { const s = actx.createBufferSource(); s.buffer = noise; s.loop = true; const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q; const g = actx.createGain(); env(g, t, 0.001, peak, d); s.connect(f).connect(g).connect(comp); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.05); };
  const tone = (t, midi, dur, type, peak, cutoff, att = 0.005, det = 0) => { const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain(); o.type = type; o.frequency.value = mtf(midi); o.detune.value = det; f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t); f.frequency.exponentialRampToValueAtTime(Math.max(150, cutoff * 0.3), t + att + dur); env(g, t, att, peak, dur); o.connect(f).connect(g).connect(comp); o.start(t); o.stop(t + att + dur + 0.05); };

      <div class="songs">${DANCE_TRACKS.map(t => `<div class="songcard" style="--c:${t.colors[0]}"><span class="eyebrow">${t.bpm} BPM</span><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div>`).join('')}
        <div class="songcard own" style="--c:var(--cream)"><span class="eyebrow">Your music</span><b id="ownTitle">${custom ? esc(custom.title) : 'Use a song from this computer'}</b>
          <span id="ownInfo">${custom ? `${custom.bpm} BPM` : 'MP3, M4A or WAV'}</span>
          <div class="ownbtns"><label class="btn ghost" for="songFile">${custom ? 'Change' : 'Choose file'}</label><input type="file" id="songFile" accept="audio/*" hidden>
          <button class="btn ghost" id="tapBtn" ${custom ? '' : 'hidden'}>Tap the beat</button></div></div></div>`);
    const chips = () => { const el = $('#readyChips'); if (el) el.innerHTML = roster.map(p => { const ok = performance.now() - (lastData.get(p.id) || -1e9) < 2500; return `<span class="chip ${ok ? 'done' : ''}" style="--c:${p.color}"><i></i>${esc(p.name)}${ok ? ' · ready' : ''}</span>`; }).join(''); };
    chips(); const civ = setInterval(chips, 500); H.cleanup.push(() => clearInterval(civ));
    $('#songFile').onchange = async e => {

const CAM_AW = 320, CAM_AH = 180;

}
function camFrame() { H.cam.actx.drawImage(H.cam.video, 0, 0, CAM_AW, CAM_AH); return H.cam.actx.getImageData(0, 0, CAM_AW, CAM_AH).data; }
async function camAvgFrame(n = 2) {
  const acc = new Float32Array(CAM_AW * CAM_AH * 3);

    const d = camFrame();
    for (let i = 0, j = 0; i < d.length; i += 4, j += 3) { acc[j] += d[i]; acc[j + 1] += d[i + 1]; acc[j + 2] += d[i + 2]; }

}
// Finds the spot that got brighter between two frames (a phone screen lighting up).
// A real flash is brighter than BOTH the frame before and the frame after, which filters out people moving.
function beaconMap(off, on, off2 = off) {
  const d = new Float32Array(CAM_AW * CAM_AH);
  const pos = (a, b, j) => Math.max(0, a[j] - b[j]) + Math.max(0, a[j + 1] - b[j + 1]) + Math.max(0, a[j + 2] - b[j + 2]);

}

    const s = I[(y + r + 1) * (W + 1) + x + r + 1] - I[(y - r) * (W + 1) + x + r + 1] - I[(y + r + 1) * (W + 1) + x - r] + I[(y - r) * (W + 1) + x - r];

async function camCalibrate(players, progress) {
  const cam = H.cam, found = new Set();
  players.forEach(p => { setView(p, { kind: 'beacon', color: p.color, name: p.name }); send(p, { t: 'beacon', on: false }); });
  await sleepRaw(1800);
  for (let pass = 0; pass < 2; pass++) {
    const todo = players.filter(p => !found.has(p.id) && p.connected);
    for (const [i, p] of todo.entries()) {
      progress && progress(`Looking for ${p.name}… (${i + 1} of ${todo.length}${pass ? ', second try' : ''})`);
      // Flash twice: a real phone lights up in the same spot both times, a moving person almost never does.
      const frames = [await camAvgFrame(2)];
      for (let k = 0; k < 2; k++) {
        send(p, { t: 'beacon', on: true }); await sleepRaw(520); frames.push(await camAvgFrame(2));

}

/* ---------- Camera effects for Dance Riot ---------- */
function makeCamFx(track, roster, stats) {
  if (!camOn()) return null;
  const cam = H.cam, v = cam.video, vw = () => v.videoWidth || cam.w, vh = () => v.videoHeight || cam.h;
  const small = document.createElement('canvas'); small.width = 64; small.height = 36; const sc = small.getContext('2d', { willReadFrequently: true });

  const photos = [], usePhotos = !!cam.photos;

  const toCanvas = (pos, W, Hh, f) => { let x = ((pos.x * vw() - f.sx) / f.sw) * W; if (cam.mirror) x = W - x; return [x, ((pos.y * vh() - f.sy) / f.sh) * Hh]; };

  const pill = (c, text, x, y, bg, fg, font, padX = 14, h = 34) => {
    c.font = font; const w = c.measureText(text).width + padX * 2;
    c.fillStyle = bg; c.beginPath(); c.roundRect(x - w / 2, y - h / 2, w, h, h / 2); c.fill();
    c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, x, y + 1);
  };
  const fx = {
    photos,
    mapped: p => cam.pos.has(p.id),
    update(now) {
      if (now - lastHype < 100) return; lastHype = now;
      try {
        sc.drawImage(v, 0, 0, 64, 36); const d = sc.getImageData(0, 0, 64, 36).data, lum = new Float32Array(64 * 36);
        for (let i = 0, j = 0; i < d.length; i += 4, j++) lum[j] = d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11;
        if (prev) { let s = 0; for (let j = 0; j < lum.length; j++) s += Math.abs(lum[j] - prev[j]); const h = Math.max(0, Math.min(1, (s / lum.length - 2) / 10)); hype += (h - hype) * 0.25; }
        prev = lum;
      } catch {}
      if (hype > 0.6 && now - lastPhoto > 9000) fx.photo('The crowd went feral');
    },
    drawBg(c, W, Hh) { drawVideo(c, W, Hh); c.fillStyle = 'rgba(11,14,34,.52)'; c.fillRect(0, 0, W, Hh); },
    drawTags(c, W, Hh, now, fontD, fontB) {
      const f = fit(W, Hh);
      for (const p of roster) {
        const pos = cam.pos.get(p.id); if (!pos) continue;
        const [x, y] = toCanvas(pos, W, Hh, f), st = stats.get(p.id);
        c.save(); c.shadowColor = p.color; c.shadowBlur = 18; pill(c, p.name, x, y - 34, p.color, '#10142e', fontB(20)); c.restore();
        for (const q of st.pops) { const k = (now - q.t) / 1100; if (k > 1) continue; c.globalAlpha = 1 - k; c.fillStyle = q.color; c.font = fontD(q.text === 'GOLD!' ? 40 : 30); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(q.text, x, y - 76 - k * 46); c.globalAlpha = 1; }
      }
    },
    drawOverlay(c, W, Hh, now, fontD, fontB) {
      // crowd hype meter
      const mx = 1060, my = 44, mw = 480;
      c.fillStyle = 'rgba(16,20,46,.75)'; c.beginPath(); c.roundRect(mx - 16, my - 18, mw + 32, 74, 18); c.fill();
      c.fillStyle = '#a7abd3'; c.font = fontB(18); c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText('CROWD HYPE', mx, my);
      c.fillStyle = 'rgba(255,255,255,.12)'; c.beginPath(); c.roundRect(mx, my + 18, mw, 18, 9); c.fill();
      const hg = c.createLinearGradient(mx, 0, mx + mw, 0); hg.addColorStop(0, track.colors[0]); hg.addColorStop(1, track.colors[2] || track.colors[1]);
      c.fillStyle = hg; c.beginPath(); c.roundRect(mx, my + 18, Math.max(18, mw * hype), 18, 9); c.fill();
      if (hype > 0.6) { c.fillStyle = '#ffd84d'; c.font = fontD(22); c.textAlign = 'right'; c.fillText('FERAL', mx + mw, my); }
      // jumbotron
      if (jumbo && now < jumbo.until) {
        const k = Math.min(1, (now - jumbo.t0) / 260), bw = 520 * (0.6 + 0.4 * k), bh = bw * 9 / 16, bx = 1040 + (520 - bw) / 2, by = 120;
        const cw = vw() * 0.34, chh = cw * 9 / 16, sx = Math.max(0, Math.min(vw() - cw, jumbo.pos.x * vw() - cw / 2)), sy = Math.max(0, Math.min(vh() - chh, jumbo.pos.y * vh() - chh / 2));
        c.save(); c.shadowColor = '#ffd84d'; c.shadowBlur = 40; c.fillStyle = '#ffd84d'; c.beginPath(); c.roundRect(bx - 7, by - 7, bw + 14, bh + 14, 20); c.fill(); c.restore();

        c.restore();

    },
    gold(hits) {

      const mapped = hits.filter(p => cam.pos.has(p.id)).sort((a, b) => stats.get(b.id).score - stats.get(a.id).score);
      if (mapped[0]) jumbo = { p: mapped[0], pos: cam.pos.get(mapped[0].id), t0: now, until: now + 2800 };

      c.fillStyle = '#f7efe2'; c.font = '700 24px "Familjen Grotesk", system-ui, sans-serif'; c.fillText(`${track.title} · ${label}`, 268, Hh - 34);

    document.querySelectorAll('.reelthumb').forEach((b, k2) => b.classList.toggle('on', k2 === i));
  };
  show(0);
  document.querySelectorAll('.reelthumb').forEach(b => b.onclick = () => show(+b.dataset.k));
  $('#reelPlay').onclick = () => { if (play) { clearInterval(play); play = null; $('#reelPlay').textContent = 'Slideshow'; } else { play = setInterval(() => show(i + 1), 2600); $('#reelPlay').textContent = 'Pause'; } };
  H.cleanup.push(() => clearInterval(play));
  $('#reelSend').onclick = async () => {
    const b = $('#reelSend'); b.disabled = true; b.textContent = 'Sending…';
    const pick10 = photos.length > 10 ? photos.filter((_, k) => k % Math.ceil(photos.length / 10) === 0).slice(0, 10) : photos;
    const small = (await Promise.all(pick10.map(p => shrinkJpeg(p.url, 720, 0.7)))).map((u, k) => ({ url: u, label: pick10[k].label })).filter(x => x.url);
    roster.forEach(p => { send(p, { t: 'photo', reset: true }); small.forEach(x => send(p, { t: 'photo', url: x.url, label: x.label })); setView(p, { kind: 'photos', title }); });
    b.textContent = `Sent ${small.length} to phones`;
  };
}

/* =========================================================
   PHONE
   ========================================================= */
let P = null;
function startPhone(code) {
  document.body.className = 'phone';
  let token = store.get('couchriot-token');
  if (!token) { token = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('couchriot-token', token); }
  P = { code, token, name: store.get('couchriot-name') || '', color: null, joined: false, status: 'connecting', view: null, sel: new Set(), draft: '' };
  app.innerHTML = `<div class="phone-app"><div class="phead"><div class="me" id="me"></div><div class="status" id="status"></div></div><div class="pbody" id="pbody"></div></div>`;
  P.tx = phoneTransport(code, onPhoneMsg, s => {
    P.status = s;
    if (s === 'open' && P.name && P.wantJoin !== false) P.tx.send({ t: 'join', name: P.name, token: P.token });
    renderPhone();
  });
  renderPhone();
}
function phoneTransport(code, onMsg, onStatus) {
  if (LOCAL) {
    const cid = 'c' + Math.random().toString(36).slice(2, 9);
    const bc = new BroadcastChannel(PREFIX + code);
    bc.onmessage = e => { const m = e.data; if (m.to === cid) onMsg(m.data); };
    setTimeout(() => onStatus('open'), 0);
    return { send: d => bc.postMessage({ to: 'host', from: cid, data: d }) };
  }
  if (RELAY) {
    let ws = null;
    const connect = () => {
      onStatus('connecting');
      ws = new WebSocket(relayWs(code, 'role=player'));
      ws.onopen = () => onStatus('open');
      ws.onmessage = e => {
        if (e.data === 'pong') return;
        let m; try { m = JSON.parse(e.data); } catch { return; }
        if (m.t === '_nohost') { onStatus('nohost'); return; }
        if (m.t === '_hostback') { onStatus('open'); return; }
        onMsg(m);
      };
      ws.onclose = () => { onStatus('lost'); setTimeout(connect, 1500); };
    };
    connect();
    setInterval(() => { if (ws && ws.readyState === 1) ws.send('ping'); }, 20000);
    return { send: d => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(d)); } };
  }
  if (typeof Peer === 'undefined') { setTimeout(() => onStatus('nolib'), 0); return { send() {} }; }
  let conn = null, gen = 0;
  const peer = new Peer();
  const connect = () => {
    const g = ++gen;
    onStatus('connecting');
    conn = peer.connect(PREFIX + code, { reliable: true });
    conn.on('open', () => g === gen && onStatus('open'));
    conn.on('data', d => g === gen && onMsg(d));
    conn.on('close', () => { if (g === gen) { onStatus('lost'); setTimeout(connect, 1500); } });
  };
  peer.on('open', connect);
  peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
  peer.on('error', e => { if (e.type === 'peer-unavailable') { onStatus('noroom'); setTimeout(connect, 3000); } else onStatus('error'); });
  return { send: d => { if (conn && conn.open) conn.send(d); } };
}
function onPhoneMsg(m) {
  if (m.t === 'welcome') { P.joined = true; P.name = m.name; P.color = m.color; store.set('couchriot-name', m.name); }
  else if (m.t === 'taken') { P.joined = false; P.error = 'Someone in this room already has that name. Pick another.'; P.wantJoin = false; }
  else if (m.t === 'full') { P.joined = false; P.error = 'This room is full (12 players).'; P.wantJoin = false; }
  else if (m.t === 'beacon') { const b = $('#beacon'); if (b) b.classList.toggle('on', !!m.on); return; }
  else if (m.t === 'photo') {
    if (m.reset) P.photos = [];
    else if (JPEG_RE.test(String(m.url || ''))) P.photos = [...(P.photos || []), { url: m.url, label: String(m.label || '').slice(0, 120) }].slice(-12);
    if (P.view && P.view.kind === 'photos') renderPhone();
    return;
  }
  else if (m.t === 'pad') {
    P.padText = m;
    const el = $('#padStatus');
    if (el) { el.textContent = m.text; el.style.setProperty('--c', m.color); }
    if (navigator.vibrate && /CAUGHT|BOOM/.test(m.text)) { try { navigator.vibrate(200); } catch {} }
    return;
  }
  else if (m.t === 'view') {
    const v = m.v;
    if (v.kind === 'pad' && (!P.view || P.view.kind !== 'pad')) P.padText = null;
    if (!P.view || v.rid !== P.view.rid || v.kind !== P.view.kind) { P.sel = new Set(); P.draft = ''; }
    P.view = v;
  }
  renderPhone();
}
function answer(value) { P.tx.send({ t: 'ans', rid: P.view.rid, value }); P.view = { kind: 'wait', msg: 'Sending…' }; renderPhone(); }

async function enableMotion() {
  const msg = t => { P.motionMsg = t; const el = $('#motionMsg'); if (el) el.textContent = t; };
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      const r = await DeviceMotionEvent.requestPermission();
      if (r !== 'granted') { msg('Motion was blocked. On iPhone: Settings > Apps > Safari > Motion & Orientation Access, then reload this page.'); return; }
    }
  } catch { msg('Couldn\'t turn on motion. Try reloading the page.'); return; }
  if (P.motionOn) return;
  P.motionOn = true; P.danceRendered = null; P.padText = null;
  const buckets = []; let acc = 0, n = 0, bucketStart = performance.now(), lp = null;
  window.addEventListener('devicemotion', e => {
    let ax, ay, az;
    if (e.acceleration && e.acceleration.x != null) { ax = e.acceleration.x; ay = e.acceleration.y; az = e.acceleration.z; }
    else if (e.accelerationIncludingGravity && e.accelerationIncludingGravity.x != null) {
      const g = e.accelerationIncludingGravity, v = [g.x, g.y, g.z];
      lp = lp ? lp.map((x, i) => x * 0.9 + v[i] * 0.1) : v; ax = v[0] - lp[0]; ay = v[1] - lp[1]; az = v[2] - lp[2];
    } else return;
    const rr = e.rotationRate, rot = rr ? Math.hypot(rr.alpha || 0, rr.beta || 0, rr.gamma || 0) : 0;
    const m = Math.hypot(ax || 0, ay || 0, az || 0) + rot / 100;
    P.motionSeen = true;
    const now = performance.now();
    if (now - bucketStart > 1000) { bucketStart = now; acc = 0; n = 0; }
    while (now - bucketStart >= 33) { buckets.push(n ? acc / n : (buckets.length ? buckets[buckets.length - 1] : m)); acc = 0; n = 0; bucketStart += 33; }
    acc += m; n++;
  });
  setInterval(() => {
    if (!P.view || P.view.kind !== 'dance') { buckets.length = 0; return; }
    if (!buckets.length) return;
    P.tx.send({ t: 'in', v: { m: buckets.splice(0, 30).map(x => Math.round(x * 10) / 10) } });
  }, 200);
  setTimeout(() => { if (!P.motionSeen) msg('No motion sensor found on this device. You can still dance, but you won\'t score.'); }, 2500);
  try { navigator.wakeLock?.request('screen').catch(() => {}); } catch {}
  renderPhone();
}

function renderPhone() {
  const st = { connecting: 'Connecting…', open: 'Connected', lost: 'Reconnecting…', noroom: 'Room not found, retrying…', nohost: 'Waiting for the host screen…', error: 'Connection error', nolib: 'Could not load' }[P.status] || '';
  $('#status').textContent = `Room ${P.code} · ${st}`;
  $('#status').className = 'status' + (P.status === 'open' ? '' : ' bad');
  $('#me').innerHTML = P.joined ? `<i style="--c:${P.color}"></i>${esc(P.name)}` : '<span class="muted">Couch Riot</span>';
  const body = $('#pbody');
  if (P.status === 'nolib') { body.innerHTML = `<h1>Couldn't connect</h1><p class="psub">The connection library didn't load. Check your internet and reload.</p>`; return; }
  if (!P.joined) {
    if (document.activeElement?.id === 'nameIn') return;
    body.innerHTML = `<h1>Join room ${esc(P.code)}</h1>${P.error ? `<p class="psub" style="color:var(--tang)">${esc(P.error)}</p>` : ''}
      <form id="nameForm" style="display:grid;gap:12px"><input id="nameIn" maxlength="14" placeholder="Your name" value="${esc(P.name)}" autocomplete="nickname" aria-label="Your name">
      <button class="btn" type="submit" ${P.status !== 'open' ? 'disabled' : ''}>Join</button></form>`;
    $('#nameForm').onsubmit = e => { e.preventDefault(); const n = $('#nameIn').value.trim(); if (!n) return; P.name = n; P.error = ''; P.wantJoin = true; $('#nameIn').blur(); P.tx.send({ t: 'join', name: n, token: P.token }); };
    return;
  }
  const v = P.view || { kind: 'wait', msg: 'Waiting for the host…' };
  if (v.kind === 'wait') {
    body.innerHTML = `<div class="pwait"><div class="dot" style="--c:${P.color}"></div><h1>${esc(v.msg)}</h1></div>
      <div class="hkwrap"><div class="eyebrow">Heckle the big screen</div><div class="heckles">${HECKLES.map((e, i) => `<button class="hk-btn" data-e="${i}" aria-label="Send ${e}">${e}</button>`).join('')}</div></div>`;
    body.querySelectorAll('.hk-btn').forEach(b => b.onclick = () => { const now = Date.now(); if (now - (P.lastHk || 0) < 250) return; P.lastHk = now; P.tx.send({ t: 'heckle', e: +b.dataset.e }); b.animate([{ transform: 'scale(.8)' }, { transform: 'scale(1)' }], 180); });
  } else if (v.kind === 'choose') {
    body.innerHTML = `<h1>${esc(v.prompt)}</h1>${v.sub ? `<p class="psub">${esc(v.sub)}</p>` : ''}
      <div class="opts">${v.options.map((o, i) => `<button class="opt" data-i="${i}" ${o.color ? `style="--c:${o.color}"` : ''}>${o.color ? '<i></i>' : ''}<span>${esc(o.label)}</span></button>`).join('')}</div>`;
    body.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(v.options[b.dataset.i].id));
  } else if (v.kind === 'text') {
    if (document.activeElement?.id === 'txt' && P.renderedRid === v.rid) return;
    P.renderedRid = v.rid;
    body.innerHTML = `<h1>${esc(v.prompt)}</h1>${v.sub ? `<p class="psub" style="white-space:pre-line">${esc(v.sub)}</p>` : ''}
      <form id="tf" style="display:grid;gap:10px">${v.numeric ? `<input id="txt" inputmode="decimal" autocomplete="off" maxlength="${v.max || 20}" placeholder="${esc(v.placeholder || '')}" aria-label="Your answer" value="${esc(P.draft)}">` : `<textarea id="txt" rows="4" maxlength="${v.max || 140}" placeholder="${esc(v.placeholder || '')}" aria-label="Your answer">${esc(P.draft)}</textarea>`}
      <div class="counter" id="cnt"></div><button class="btn" type="submit">Send</button></form>`;
    if (v.image) {
      const cv = document.createElement('canvas'); cv.className = 'dc refimg'; cv.width = v.iw; cv.height = v.ih;
      $('#tf').before(cv); const c = cv.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, v.iw, v.ih); drawStrokes(c, v.image);
    }
    const t = $('#txt'), cnt = $('#cnt');
    const upd = () => { P.draft = t.value; cnt.textContent = `${t.value.length} / ${v.max || 140}`; };
    t.oninput = upd; upd();
    $('#tf').onsubmit = e => { e.preventDefault(); const val = t.value.trim(); if (!val) return; t.blur(); answer(val); };
  } else if (v.kind === 'texts') {
    if (document.activeElement?.classList.contains('mt') && P.renderedRid === v.rid) return;
    if (P.renderedRid !== v.rid) P.mdraft = [];
    P.renderedRid = v.rid;
    body.innerHTML = `<h1>${esc(v.prompt)}</h1>${v.sub ? `<p class="psub">${esc(v.sub)}</p>` : ''}
      <form id="mtf" class="mtf" style="display:grid;gap:16px">${v.items.map((it, i) => `<label><span>${esc(it.prompt)}</span>${it.options
        ? `<select class="mt" data-i="${i}"><option value="">Pick someone…</option>${it.options.map(o => `<option ${P.mdraft[i] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
        : `<textarea class="mt" data-i="${i}" rows="2" maxlength="${it.max || 80}" placeholder="${esc(it.placeholder || '')}">${esc(P.mdraft[i] || '')}</textarea>`}</label>`).join('')}
      <button class="btn" type="submit">Send</button></form>`;
    body.querySelectorAll('.mt').forEach(el => el.oninput = el.onchange = () => { P.mdraft[+el.dataset.i] = el.value; });
    $('#mtf').onsubmit = e => { e.preventDefault(); const vals = [...body.querySelectorAll('.mt')].map(el => el.value.trim()); if (vals.every(x => !x)) return; document.activeElement?.blur(); answer(vals); };
  } else if (v.kind === 'multi') {
    body.innerHTML = `<h1>${esc(v.prompt)}</h1>${v.sub ? `<p class="psub">${esc(v.sub)}</p>` : ''}
      <div class="opts">${v.items.map((it, i) => `<button class="opt ${P.sel.has(i) ? 'sel' : ''}" data-i="${i}" aria-pressed="${P.sel.has(i)}"><span class="box">${P.sel.has(i) ? '✓' : ''}</span><span>${esc(it)}</span></button>`).join('')}</div>
      <button class="btn" id="msub">Lock in ${P.sel.size} ${P.sel.size === 1 ? 'confession' : 'confessions'}</button>`;
    body.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const i = +b.dataset.i; P.sel.has(i) ? P.sel.delete(i) : P.sel.add(i);
      const on = P.sel.has(i); b.classList.toggle('sel', on); b.setAttribute('aria-pressed', on); b.querySelector('.box').textContent = on ? '✓' : '';
      $('#msub').textContent = `Lock in ${P.sel.size} ${P.sel.size === 1 ? 'confession' : 'confessions'}`;
    });
    $('#msub').onclick = () => answer([...P.sel]);
  } else if (v.kind === 'draw') {
    if (P.drawRendered === v && $('#dc')) return;
    P.drawRendered = v; P.strokes = []; P.dcol = 0; P.dw = 6;
    body.innerHTML = `<h1>${esc(v.prompt)}</h1>${v.sub ? `<p class="psub">${esc(v.sub)}</p>` : ''}
      ${v.ref ? `<div class="psub" style="text-align:center">${esc(v.refLabel || 'For reference')}</div><canvas id="dref" class="dc refimg" width="${v.rw}" height="${v.rh}"></canvas>` : ''}
      <canvas id="dc" class="dc" width="${v.w}" height="${v.h}"></canvas>
      ${v.ask ? `<input id="dname" maxlength="40" placeholder="${esc(v.ask)}" aria-label="${esc(v.ask)}" autocomplete="off">` : ''}
      <div class="swatches">${PALETTE.map((c, i) => `<button class="sw ${i === 0 ? 'on' : ''}" data-c="${i}" style="--c:${c}" aria-label="${i === PALETTE.length - 1 ? 'Eraser (white)' : 'Color ' + (i + 1)}"></button>`).join('')}</div>
      <div class="dbtns"><button class="btn ghost" id="dthick">Thin</button><button class="btn ghost" id="dundo">Undo</button><button class="btn" id="ddone">Done</button></div>`;
    if (v.ref) { const rc = $('#dref').getContext('2d'); rc.fillStyle = '#fff'; rc.fillRect(0, 0, v.rw, v.rh); drawStrokes(rc, v.ref); }
    const cv = $('#dc'), c = cv.getContext('2d');
    const redraw = () => {
      c.fillStyle = '#ffffff'; c.fillRect(0, 0, v.w, v.h);
      if (v.guide) {
        c.save(); c.globalAlpha = 0.45; drawStrokes(c, v.guide, 1, 0, v.guideDy || 0); c.restore();
        c.save(); c.strokeStyle = '#ff4fa3'; c.lineWidth = 2; c.setLineDash([10, 8]); c.beginPath(); c.moveTo(0, v.guideLine); c.lineTo(v.w, v.guideLine); c.stroke(); c.restore();
      }
      drawStrokes(c, P.strokes);
    };
    redraw();
    const pos = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * v.w), Math.round((e.clientY - r.top) / r.height * v.h)]; };
    let cur = null;
    cv.addEventListener('pointerdown', e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch {} cur = { c: P.dcol, w: P.dw, p: pos(e) }; P.strokes.push(cur); drawStrokes(c, [cur]); });
    cv.addEventListener('pointermove', e => {
      if (!cur) return;
      const [x, y] = pos(e), n = cur.p.length, lx = cur.p[n - 2], ly = cur.p[n - 1];
      if (Math.hypot(x - lx, y - ly) < 3) return;
      cur.p.push(x, y);
      c.strokeStyle = PALETTE[cur.c]; c.lineWidth = cur.w; c.lineCap = 'round'; c.beginPath(); c.moveTo(lx, ly); c.lineTo(x, y); c.stroke();
    });
    const end = () => { cur = null; };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    body.querySelectorAll('.sw').forEach(b => b.onclick = () => { P.dcol = +b.dataset.c; body.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); });
    $('#dthick').onclick = () => { P.dw = P.dw === 6 ? 16 : P.dw === 16 ? 3 : 6; $('#dthick').textContent = P.dw === 6 ? 'Thin' : P.dw === 16 ? 'Thick' : 'Fine'; };
    $('#dundo').onclick = () => { P.strokes.pop(); redraw(); };
    $('#ddone').onclick = () => {
      let strokes = P.strokes;
      while (JSON.stringify(strokes).length > 150000) strokes = strokes.map(s => ({ ...s, p: s.p.filter((_, i) => (i >> 1) % 2 === 0 || i >= s.p.length - 2) }));
      answer({ strokes, name: v.ask ? ($('#dname')?.value || '').trim() : undefined });
    };
  } else if (v.kind === 'beacon') {
    if (P.beaconRendered === v && $('#beacon')) return;
    P.beaconRendered = v;
    body.innerHTML = `<div class="beacon" id="beacon" style="--c:${esc(v.color)}"><div class="beaconin"><b>${esc(v.name)}</b><span>Turn your brightness all the way up and hold this screen toward the camera.</span></div></div>`;
    try { navigator.wakeLock?.request('screen').catch(() => {}); } catch {}
  } else if (v.kind === 'seat') {
    if (P.seatRendered === v && $('#seatImg')) return;

      <button class="btn" id="seatOk" disabled>That's me</button>`;
    $('#seatBox').addEventListener('click', e => {
      const r = $('#seatImg').getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;

      P.seatPick = { x, y }; const d = $('#seatDot'); d.hidden = false; d.style.left = (x * 100) + '%'; d.style.top = (y * 100) + '%'; $('#seatOk').disabled = false;
    });
    $('#seatOk').onclick = () => P.seatPick && answer(P.seatPick);
  } else if (v.kind === 'photos') {
    const ph = P.photos || [];
    body.innerHTML = `<h1>${esc(v.title || 'Photo reel')}</h1><p class="psub">Press and hold a photo to save it.</p>
      <div class="pphotos">${ph.map(x => `<figure><img src="${x.url}" alt="${esc(x.label)}"><figcaption>${esc(x.label)}</figcaption></figure>`).join('') || '<p class="psub">Photos incoming…</p>'}</div>`;
  } else if (v.kind === 'dance') {
    if (P.danceRendered === v && $('#padStatus')) return;
    P.danceRendered = v;
    const st = P.padText;
    body.innerHTML = `<div class="pad"><div class="eyebrow">${esc(v.title || 'Dance Riot')}</div>
      <div class="padstatus" id="padStatus" style="--c:${st ? st.color : P.motionOn ? 'var(--mint)' : 'var(--line)'}">${esc(st ? st.text : P.motionOn ? 'Motion on. Get ready!' : 'Turn on motion to play')}</div>
      <div class="dancehand"><b>Right hand.</b> Hold your phone firmly and copy the dancer on the big screen like a mirror.</div>
      ${P.motionOn ? '' : '<button class="btn" id="motionBtn">Turn on motion</button>'}
      <p class="psub" id="motionMsg">${esc(P.motionMsg || '')}</p></div>`;
    $('#motionBtn')?.addEventListener('click', enableMotion);
  } else if (v.kind === 'pad') {
    if (P.padRendered === v && $('#padBtn')) return;
    P.padRendered = v;
    const st = P.padText;
    body.innerHTML = `<div class="pad"><div class="eyebrow">${esc(v.title || '')}</div>
      <div class="padstatus" id="padStatus" style="--c:${st ? st.color : 'var(--line)'}">${esc(st ? st.text : 'Get ready…')}</div>
      <button class="padbtn" id="padBtn" style="--c:${v.color || 'var(--tang)'}">${esc(v.label)}</button>
      ${v.sub ? `<p class="psub">${esc(v.sub)}</p>` : ''}</div>`;
    const btn = $('#padBtn');
    let down = false;
    const press = e => { e.preventDefault(); if (down) return; down = true; try { btn.setPointerCapture(e.pointerId); } catch {} btn.classList.add('down'); P.tx.send({ t: 'in', v: 1 }); };
    const release = e => { if (!down) return; down = false; btn.classList.remove('down'); P.tx.send({ t: 'in', v: 0 }); };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('lostpointercapture', release);
    btn.addEventListener('contextmenu', e => e.preventDefault());
  } else if (v.kind === 'bingo') {
    const n = v.marked.filter(Boolean).length;
    body.innerHTML = `<h1>${esc(v.title)}</h1><p class="psub">${n} of 9 marked. Three in a row wins.</p>
      <div class="pgrid">${v.cells.map((c, i) => `<div class="${v.marked[i] ? 'on' : ''}">${esc(c)}</div>`).join('')}</div>`;
  }
}
