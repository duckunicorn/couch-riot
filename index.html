<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Couch Riot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Familjen+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: projector stage (header / big stage / control bar) for the host; single-column thumb UI for phones. One deliberate dark look so it reads on a projector. */
:root {
  --ink: #10142e;
  --panel: #1b2152;
  --line: #2f3874;
  --cream: #f7efe2;
  --muted: #a7abd3;
  --tang: #ff7a45;
  --lilac: #b9a7ff;
  --butter: #ffd84d;
  --mint: #5fe0b5;
  --display: 'Dela Gothic One', 'Arial Black', Impact, sans-serif;
  --body: 'Familjen Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body, #app { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--cream);
  font-family: var(--body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.host { font-size: clamp(16px, 1.15vw, 30px); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
.eyebrow { text-transform: uppercase; letter-spacing: .14em; font-weight: 700; font-size: .8em; color: var(--lilac); }
.muted { color: var(--muted); }
.btn {
  border: 0; border-radius: 999px; padding: .75em 1.5em; font-weight: 700;
  background: var(--tang); color: var(--ink); font-size: 1em;
  box-shadow: 0 .25em 0 #b84a1f; transition: transform .08s;
}
.btn:active { transform: translateY(.15em); box-shadow: 0 .1em 0 #b84a1f; }
.btn.ghost { background: transparent; color: var(--cream); box-shadow: none; border: 2px solid var(--line); }
.btn[disabled] { opacity: .45; cursor: default; }

/* ---------- Chooser ---------- */
.chooser { min-height: 100%; display: grid; place-items: center; padding-block: 32px; }
.chooser-inner { width: 100%; max-width: 520px; display: grid; gap: 28px; }
.logo { font-family: var(--display); font-size: clamp(48px, 12vw, 96px); line-height: .9; }
.logo span { color: var(--tang); display: block; }
.join-row { display: flex; gap: 10px; flex-wrap: wrap; }
.join-row input { flex: 1 1 160px; min-width: 0; }
input, textarea {
  font: inherit; color: var(--cream); background: var(--panel); border: 2px solid var(--line);
  border-radius: 14px; padding: .8em 1em; width: 100%;
}
input.code { text-transform: uppercase; letter-spacing: .3em; font-weight: 700; font-size: 1.3em; }

/* ---------- Host ---------- */
.host-app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 1em; padding-block: 1em; }
.topbar { display: flex; align-items: center; gap: 1.25em; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 1.5em; }
.brand b { color: var(--tang); font-weight: 400; }
.roomtag { background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: .3em .9em; font-weight: 700; }
.roomtag strong { color: var(--butter); letter-spacing: .2em; }
.chips { display: flex; gap: .45em; flex-wrap: wrap; margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: .4em; padding: .25em .7em; border-radius: 999px; background: var(--panel); font-weight: 600; font-size: .9em; }
.chip i { width: .7em; height: .7em; border-radius: 50%; background: var(--c, var(--lilac)); }
.chip.off { opacity: .4; }
.chip.done { background: var(--c); color: var(--ink); }
.chip.done i { background: var(--ink); }
.stage { min-height: 0; overflow: auto; display: flex; flex-direction: column; justify-content: flex-start; gap: 1.2em; }
/* Center short screens, but let tall ones scroll from the top instead of clipping. */
.stage > :first-child { margin-top: auto; }
.stage > :last-child { margin-bottom: auto; }
.controls { display: flex; align-items: center; gap: 1em; flex-wrap: wrap; min-height: 3.2em; }
.controls .spacer { flex: 1; }
.clock { font-family: var(--display); font-size: 1.6em; color: var(--butter); font-variant-numeric: tabular-nums; min-width: 2.5em; text-align: center; }
.clock.low { color: var(--tang); }
.waiting { display: flex; gap: .4em; flex-wrap: wrap; align-items: center; }

.big { font-size: clamp(28px, 4.2vw, 110px); line-height: 1.05; max-width: 22ch; }
.big.quote { color: var(--butter); }
.sub { font-size: 1.35em; color: var(--muted); max-width: 45ch; margin: 0; }

/* lobby */
.lobby { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 2.5em; align-items: start; height: 100%; }
.joinpanel { background: var(--cream); color: var(--ink); border-radius: 1.4em; padding: 1.5em; display: grid; gap: 1em; justify-items: center; text-align: center; }
.joinpanel .qr { width: 100%; max-width: 15em; aspect-ratio: 1; }
.joinpanel .qr svg { width: 100%; height: 100%; display: block; }
.joinpanel .bigcode { font-family: var(--display); font-size: 3.4em; letter-spacing: .12em; line-height: 1; color: var(--tang); }
.joinpanel .url { font-weight: 700; word-break: break-all; }
.menu { display: grid; gap: 1.6em; min-width: 0; }
.cat h2 { font-size: 1.1em; color: var(--lilac); font-family: var(--body); font-weight: 700; text-transform: uppercase; letter-spacing: .14em; margin-bottom: .6em; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(14em, 1fr)); gap: .8em; }
.gcard { text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 1em; padding: 1em 1.1em; display: grid; gap: .35em; align-content: start; }
.gcard h3 { font-size: 1.15em; }
.gcard p { margin: 0; color: var(--muted); font-size: .92em; }
.gcard .meta { font-size: .78em; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--mint); }
.gcard.ready:hover { border-color: var(--tang); transform: translateY(-2px); }
.gcard.soon { opacity: .5; cursor: default; }
.gcard.soon .meta { color: var(--muted); }
.notice { background: var(--butter); color: var(--ink); padding: .6em 1em; border-radius: .8em; font-weight: 600; }

/* bars */
.bars { display: grid; gap: .6em; width: 100%; max-width: 60em; }
.bar { display: grid; grid-template-columns: 9em minmax(0, 1fr) 2.5em; align-items: center; gap: .8em; font-weight: 700; font-size: 1.2em; }
.bar .track { height: 1.3em; border-radius: 999px; background: var(--panel); overflow: hidden; }
.bar .fill { height: 100%; width: 0; background: var(--c); border-radius: 999px; transition: width 1s cubic-bezier(.2,.8,.2,1); }
.bar .n { font-variant-numeric: tabular-nums; text-align: right; }
.winner { font-family: var(--display); font-size: 2.4em; color: var(--c); }

.titlewall { display: grid; grid-template-columns: repeat(auto-fill, minmax(16em, 1fr)); gap: 1em; width: 100%; }
.tcard { background: var(--panel); border-radius: 1em; padding: 1em; border-top: .4em solid var(--c); display: grid; gap: .4em; align-content: start; }
.tcard h3 { color: var(--c); }
.tcard ul { margin: 0; padding-left: 1.1em; color: var(--cream); }
.tcard .none { color: var(--muted); font-style: italic; }

.board { display: grid; gap: .5em; width: 100%; max-width: 40em; }
.brow { display: grid; grid-template-columns: 2em minmax(0, 1fr) auto; gap: 1em; align-items: center; background: var(--panel); border-radius: .8em; padding: .6em 1em; font-size: 1.3em; font-weight: 700; }
.brow .rank { font-family: var(--display); color: var(--muted); }
.brow:first-child { background: var(--butter); color: var(--ink); }
.brow:first-child .rank { color: var(--ink); }
.brow .pts { font-variant-numeric: tabular-nums; }

.meter { width: 100%; max-width: 50em; height: 2.2em; border-radius: 999px; background: var(--panel); overflow: hidden; }
.meter div { height: 100%; width: 0; background: linear-gradient(90deg, var(--tang), var(--butter)); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
.bignum { font-family: var(--display); font-size: clamp(60px, 10vw, 220px); line-height: 1; color: var(--butter); }

/* group chat */
.chatwrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 2em; align-items: start; width: 100%; }
.phoneframe { background: #0b0e22; border: .3em solid var(--line); border-radius: 1.8em; padding: 1em; display: grid; gap: .55em; max-height: 70vh; overflow: auto; }
.phoneframe .chathead { text-align: center; font-weight: 700; color: var(--muted); font-size: .85em; padding-bottom: .4em; border-bottom: 1px solid var(--line); }
.msg { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: .5em; align-items: end; animation: pop .35s ease-out; }
.msg .av { width: 2.2em; height: 2.2em; border-radius: 50%; background: var(--c); color: var(--ink); display: grid; place-items: center; font-weight: 700; }
.msg .who { font-size: .75em; color: var(--muted); font-weight: 600; }
.msg .who b { color: var(--c); }
.msg .bub { background: var(--panel); border-radius: 1em 1em 1em .25em; padding: .5em .8em; overflow-wrap: anywhere; }
.msg.dim { opacity: .3; }
@keyframes pop { from { transform: translateY(.6em) scale(.96); opacity: 0; } }

/* bingo host */
.minicards { display: flex; gap: 1em; flex-wrap: wrap; }
.mini { display: grid; gap: .3em; justify-items: center; font-weight: 700; }
.mini .g { display: grid; grid-template-columns: repeat(3, .9em); gap: .2em; }
.mini .g i { width: .9em; height: .9em; border-radius: .2em; background: var(--line); }
.mini .g i.on { background: var(--c); }

/* ---------- Phone ---------- */
body.phone { font-size: 17px; }
.phone-app { min-height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 16px; padding-block: 14px 24px; max-width: 560px; margin: 0 auto; }
.phead { display: flex; align-items: center; gap: 10px; }
.phead .me { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.phead .me i { width: 14px; height: 14px; border-radius: 50%; background: var(--c, var(--lilac)); }
.phead .status { margin-left: auto; font-size: 13px; color: var(--muted); }
.phead .status.bad { color: var(--tang); }
.pbody { display: grid; align-content: start; gap: 16px; }
.pbody h1 { font-size: 26px; line-height: 1.15; }
.pbody .psub { color: var(--muted); margin: 0; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
.opt i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); flex: none; }
.opt.sel { border-color: var(--mint); background: color-mix(in srgb, var(--mint) 18%, var(--panel)); }
.opt .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; font-size: 15px; }
.opt.sel .box { background: var(--mint); border-color: var(--mint); color: var(--ink); }
.pwait { display: grid; gap: 10px; padding-top: 18vh; text-align: center; justify-items: center; }
.pwait .dot { width: 54px; height: 54px; border-radius: 50%; background: var(--c, var(--lilac)); animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-10px) scale(.92); } }
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pgrid div { aspect-ratio: 1; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 5px; font-size: 11px; line-height: 1.2; display: grid; place-items: center; text-align: center; overflow: hidden; overflow-wrap: anywhere; }
.pgrid div.on { background: var(--butter); color: var(--ink); border-color: var(--butter); font-weight: 700; }
.counter { font-size: 13px; color: var(--muted); text-align: right; }

/* fake wikipedia */
.deflist { display: grid; gap: .6em; width: 100%; max-width: 60em; }
.def { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: .8em; align-items: start; background: var(--panel); border-radius: .9em; padding: .7em 1em; font-size: 1.25em; }
.def .dl { font-family: var(--display); color: var(--lilac); }
.def small { display: block; font-size: .7em; color: var(--muted); margin-top: .3em; font-weight: 600; letter-spacing: .02em; }
.def.real { background: var(--mint); color: var(--ink); }
.def.real .dl, .def.real small { color: var(--ink); }

/* herd + briefed */
.herds { display: grid; grid-template-columns: repeat(auto-fill, minmax(13em, 1fr)); gap: .8em; width: 100%; }
.herdcard { background: var(--panel); border-radius: 1em; padding: .9em 1em; display: grid; gap: .3em; align-content: start; border: 2px solid transparent; }
.herdcard .hl { font-family: var(--display); font-size: 1.4em; overflow-wrap: anywhere; }
.herdcard .hn { font-size: .85em; color: var(--muted); font-weight: 700; }
.herdcard.win { border-color: var(--butter); }
.herdcard.win .hl { color: var(--butter); }
.herdcard.cow { border-color: var(--tang); }
.cowtag { color: var(--tang); font-weight: 700; letter-spacing: .1em; font-size: .8em; }
.cluegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(12em, 1fr)); gap: .8em; width: 100%; }
.clue { background: var(--panel); border-radius: 1em; padding: .9em 1em; border-left: .4em solid var(--c); display: grid; gap: .2em; }
.clue span { color: var(--c); font-weight: 700; }
.clue b { font-family: var(--display); font-weight: 400; font-size: 1.8em; overflow-wrap: anywhere; }

/* hot potato */
.potato { display: flex; align-items: center; gap: 2em; flex-wrap: wrap; }
.bomb { width: 7em; height: 7em; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #4a4f7a, #10142e 70%); position: relative; animation: tick var(--spd, 1s) ease-in-out infinite; flex: none; }
.bomb::after { content: ""; position: absolute; top: -.9em; right: 1em; width: 1em; height: 1.4em; background: var(--butter); border-radius: 50% 50% 20% 20%; box-shadow: 0 0 1em var(--tang); }
@keyframes tick { 50% { transform: scale(1.08) rotate(-4deg); } }
.usedlist { display: flex; gap: .4em; flex-wrap: wrap; }
.boom { color: var(--tang); animation: pop .4s ease-out; }

/* red light */
.rl { display: grid; gap: 1.2em; width: 100%; }
.rlbanner { font-family: var(--display); font-size: clamp(40px, 6vw, 140px); text-align: center; border-radius: .3em; padding: .1em; color: var(--ink); background: var(--line); }
.rlbanner.green { background: var(--mint); }
.rlbanner.turning { background: var(--butter); }
.rlbanner.red { background: #ff5d5d; }
.rlbanner.backwards { background: #ff4fa3; }
.lanes { display: grid; gap: .5em; }
.lane { display: grid; grid-template-columns: 8em minmax(0, 1fr); gap: 1em; align-items: center; font-weight: 700; }
.lname { color: var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ltrack { position: relative; height: 1.8em; background: var(--panel); border-radius: 999px; border-right: .3em dashed var(--cream); }
.ltrack i { position: absolute; top: .1em; left: 0; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--c); }
.ltrack i.run { box-shadow: 0 0 0 .25em color-mix(in srgb, var(--c) 35%, transparent); }
.ltrack i.out { background: var(--line); opacity: .6; }
.ltrack i.done { outline: .2em solid var(--butter); }

/* canvases */
.cv { width: min(100%, calc(74vh * 16 / 9)); height: auto; margin-inline: auto; border-radius: 1em; background: #0b0e22; display: block; }
.fridgewrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2em; align-items: start; }
.cv.fridge { aspect-ratio: 8 / 14; height: 74vh; width: auto; max-width: 100%; border: .5em solid #c9d0e4; background: #e9edf7; }
.roles { display: grid; gap: .6em; align-content: start; }
.role { display: grid; gap: .1em; background: var(--panel); border-radius: .8em; padding: .6em 1em; border-left: .4em solid var(--c); }
.role b { font-family: var(--display); font-weight: 400; font-size: 1.3em; }
.role span { color: var(--c); font-weight: 700; }
.role.hit { animation: hit .25s ease-out; }
@keyframes hit { from { background: var(--c); color: var(--ink); } }
.fstat { font-family: var(--display); font-size: 1.6em; color: var(--butter); margin-top: .6em; }
.fstat span { font-variant-numeric: tabular-nums; }

/* phone pad */
.pad { display: grid; gap: 18px; justify-items: center; text-align: center; padding-top: 4vh; }
.padstatus { width: 100%; padding: 14px; border-radius: 16px; background: var(--c); color: var(--ink); font-family: var(--display); font-size: 22px; }
.padbtn { width: min(78vw, 340px); aspect-ratio: 1; border-radius: 50%; border: 0; background: var(--c); color: var(--ink); font-family: var(--display); font-size: 30px; box-shadow: 0 12px 0 color-mix(in srgb, var(--c) 55%, #000); user-select: none; -webkit-user-select: none; touch-action: none; -webkit-touch-callout: none; transition: transform .05s; }
.padbtn.down { transform: translateY(10px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 55%, #000); }

/* settings + editor */
.settings { display: flex; align-items: center; gap: .8em; flex-wrap: wrap; background: var(--panel); border-radius: 1em; padding: .6em .8em; }
.settings .spacer { flex: 1; }
.seg { display: inline-flex; background: var(--ink); border-radius: 999px; padding: .2em; gap: .2em; }
.segbtn { border: 2px solid var(--line); background: var(--ink); color: var(--cream); border-radius: 999px; padding: .4em 1em; font-weight: 700; }
.seg .segbtn { border-color: transparent; }
.segbtn.on { background: var(--butter); color: var(--ink); border-color: var(--butter); }
.segbtn.on.spicy { background: var(--tang); border-color: var(--tang); }
.segbtn.on.unhinged { background: #ff4fa3; border-color: #ff4fa3; }
.editor { display: grid; gap: 1.2em; }
.edhead { display: flex; gap: 1em; align-items: end; justify-content: space-between; flex-wrap: wrap; }
.edgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(18em, 1fr)); gap: 1em; }
.edbox { display: grid; gap: .4em; font-weight: 700; }
.edbox textarea { font-size: .9em; resize: vertical; min-height: 7em; }

/* batch 3 */
.sketch { background: #fff; border-radius: 1em; display: block; max-width: 100%; height: auto; max-height: 62vh; width: auto; }
.sketch.tall { max-height: 70vh; }
.mgallery { display: flex; gap: 1em; flex-wrap: wrap; align-items: start; }
.mgallery figure { margin: 0; display: grid; gap: .3em; justify-items: center; font-weight: 700; }
.mgallery .sketch { max-height: 46vh; }
.monsterreveal, .gallerywrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2em; align-items: center; }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 1.5em; align-items: stretch; width: 100%; }
.pitch { background: var(--panel); border-radius: 1em; padding: 1.2em; display: grid; gap: .5em; align-content: center; border: 3px solid transparent; transition: opacity .4s; }
.pitch b { font-family: var(--display); font-weight: 400; font-size: 1.8em; line-height: 1.15; overflow-wrap: anywhere; }
.pitch.win { border-color: var(--butter); }
.pitch.lose { opacity: .4; }
.vsmark { font-family: var(--display); font-size: 2.4em; color: var(--tang); align-self: center; }
.slots { display: flex; gap: .7em; flex-wrap: wrap; }
.slot { background: var(--panel); border-radius: 1em; padding: .8em 1.1em; display: grid; gap: .2em; min-width: 8em; border: 3px solid transparent; }
.slot b { font-family: var(--display); font-weight: 400; font-size: 1.7em; font-variant-numeric: tabular-nums; }
.slot small { color: var(--muted); font-weight: 700; }
.slot.win { border-color: var(--mint); }
.sync { display: grid; justify-items: center; gap: 1.5em; }
.beat { width: 14em; height: 14em; border-radius: 50%; background: var(--panel); border: .4em solid var(--lilac); display: grid; place-items: center; font-family: var(--display); font-size: 1.6em; color: var(--butter); }
.beat.pulse { animation: beatpulse .35s ease-out; }
@keyframes beatpulse { from { transform: scale(1.12); background: var(--lilac); color: var(--ink); } }
.syncdots { display: flex; gap: .6em; flex-wrap: wrap; justify-content: center; }
.sdot { padding: .4em .9em; border-radius: 999px; background: var(--panel); font-weight: 700; color: var(--c); }
.sdot.hit { animation: hit .25s ease-out; }
.dc { width: 100%; height: auto; border-radius: 12px; background: #fff; touch-action: none; display: block; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.sw { width: 36px; height: 36px; border-radius: 50%; background: var(--c); border: 3px solid var(--line); }
.sw.on { border-color: var(--butter); transform: scale(1.12); }
.dbtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* batch 4 */
#heckles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
.hk { position: absolute; bottom: -1.3em; line-height: 1; animation: rise 2.6s cubic-bezier(.2,.7,.3,1) forwards; filter: drop-shadow(0 .1em .2em rgba(0,0,0,.45)); }

   ========================================================= */
let H = null;           // host state
class Abort extends Error {}

function startHost() {
  document.body.className = 'host';
  H = { code: null, tx: null, players: [], running: null, waiter: null, pending: null, reqSeq: 0, action: null, notice: '', cleanup: [], onInput: null, jar: {}, editing: false };
  H.settings = loadSettings();
  app.innerHTML = `
  <div class="host-app">
    <div class="topbar">
      <div class="brand">Couch<b>Riot</b></div>
      <div class="roomtag" id="roomtag">Starting…</div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="controls">
      <button class="btn ghost" id="menuBtn" hidden>End game</button>
      <div class="waiting" id="waiting"></div>
      <div class="spacer"></div>
      <div class="clock" id="clock"></div>
      <button class="btn ghost" id="skipBtn" hidden>Skip waiting</button>
      <button class="btn" id="actionBtn" hidden></button>
    </div>
  </div>
  <div id="heckles" aria-hidden="true"></div>`;
  $('#menuBtn').onclick = endGame;
  $('#actionBtn').onclick = () => H.action && H.action();
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea')) return;
    if ((e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') && H.action) { e.preventDefault(); H.action(); }
  });
  try { navigator.wakeLock?.request('screen').catch(() => {}); } catch {}
  openRoom();
}

function newCode() { const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; return Array.from({ length: 4 }, () => L[Math.random() * L.length | 0]).join(''); }

function openRoom() {
  H.code = newCode();
  H.tx = hostTransport(H.code, {
    ready: () => { renderTop(); renderLobby(); },
    msg: onHostMsg,
    close: cid => { const p = H.players.find(p => p.cid === cid); if (p) { p.connected = false; renderTop(); H.pending?.check(); if (!H.running) renderLobby(); } },
    error: err => {
      if (err === 'id-taken') { openRoom(); return; }
      stage(`<div class="eyebrow">Connection problem</div><h1 class="big">Couldn't open a room</h1><p class="sub">${esc(err)}. Check the internet connection and reload the page.</p>`);
    }
  });
}

function hostTransport(code, h) {
  if (LOCAL) {
    const bc = new BroadcastChannel(PREFIX + code);
    bc.onmessage = e => { const m = e.data; if (m.to === 'host') h.msg(m.from, m.data); };
    setTimeout(h.ready, 0);
    return { send: (cid, data) => bc.postMessage({ to: cid, data }) };
  }
  if (RELAY) {
    // Cloudflare relay. The key lets this same screen reclaim its room after a Wi-Fi blip.
    const key = Math.random().toString(36).slice(2) + Date.now().toString(36);
    let ws = null, readyFired = false, stopped = false;
    const connect = () => {
      ws = new WebSocket(relayWs(code, 'role=host&key=' + key));
      ws.onopen = () => { if (!readyFired) { readyFired = true; h.ready(); } };
      ws.onmessage = e => {
        if (e.data === 'pong') return;
        let m; try { m = JSON.parse(e.data); } catch { return; }
        if (m.t === '_error') { stopped = true; h.error(m.error); return; }
        if (m.t === '_close') { h.close(m.cid); return; }
        if (m.from) h.msg(m.from, m.data);
      };
      ws.onclose = () => { if (!stopped) setTimeout(connect, readyFired ? 1500 : 4000); };
    };
    connect();
    setInterval(() => { if (ws && ws.readyState === 1) ws.send('ping'); }, 20000);
    return { send: (cid, data) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ to: cid, data })); } };
  }
  if (typeof Peer === 'undefined') { setTimeout(() => h.error('The connection library did not load'), 0); return { send() {} }; }
  const conns = new Map();
  const peer = new Peer(PREFIX + code);
  peer.on('open', h.ready);
  peer.on('error', e => h.error(e.type === 'unavailable-id' ? 'id-taken' : (e.type || String(e))));
  peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
  peer.on('connection', conn => {
    conn.on('open', () => conns.set(conn.peer, conn));
    conn.on('data', d => h.msg(conn.peer, d));
    conn.on('close', () => { if (conns.get(conn.peer) === conn) { conns.delete(conn.peer); h.close(conn.peer); } });
  });
  return { send: (cid, data) => { const c = conns.get(cid); if (c && c.open) c.send(data); } };
}

function send(p, data) { if (p.cid && p.connected) H.tx.send(p.cid, data); }
function setView(p, v) { p.view = v; send(p, { t: 'view', v }); }
function waitView(p, msg) { setView(p, { kind: 'wait', msg }); }
const byId = id => H.players.find(p => p.id === id);

function onHostMsg(cid, m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'join') {
    const name = String(m.name || '').trim().slice(0, 14);
    if (!name) return;
    const token = String(m.token || '');
    let p = H.players.find(p => p.token === token) || H.players.find(p => p.name.toLowerCase() === name.toLowerCase());
    if (p && p.token !== token && p.connected) { H.tx.send(cid, { t: 'taken' }); return; }
    if (!p) {
      if (H.players.length >= 12) { H.tx.send(cid, { t: 'full' }); return; }
      p = { id: 'p' + (H.players.length + 1) + Math.random().toString(36).slice(2, 5), name, token, color: COLORS[H.players.length % COLORS.length], score: 0, titles: [], view: null };
      H.players.push(p);
    }
    p.cid = cid; p.connected = true; p.name = name; p.token = token;
    send(p, { t: 'welcome', name: p.name, color: p.color });
    if (H.running && !H.running.roster.includes(p)) waitView(p, 'A game is in progress. You\'ll be in the next one.');
    else if (p.view) setView(p, p.view);
    else waitView(p, 'You\'re in! Waiting for the host to pick a game.');
    renderTop();
    if (!H.running) renderLobby();
    return;
  }
  const p = H.players.find(p => p.cid === cid);
  if (!p) return;
  if (m.t === 'heckle') { heckle(p, m.e); return; }
  if (m.t === 'in') { if (H.onInput && H.running && H.running.roster.includes(p)) H.onInput(p, m.v); return; }
  if (m.t === 'ans' && H.pending && m.rid === H.pending.rid && H.pending.need.has(p.id) && !H.pending.answers.has(p.id)) {
    H.pending.answers.set(p.id, m.value);
    waitView(p, H.pending.after || 'Locked in. Eyes on the big screen.');
    H.pending.check();
  }
}

/* ----- host UI helpers ----- */
function stage(html) { $('#stage').innerHTML = html; }
function renderTop() {
  $('#roomtag').innerHTML = (H.code ? `Room <strong>${H.code}</strong>` : 'Starting…') + (camOn() ? ' <span class="camdot">● CAM</span>' : '');
  const done = H.pending ? H.pending.answers : null;
  $('#chips').innerHTML = H.players.map(p => `<span class="chip ${p.connected ? '' : 'off'} ${done && done.has(p.id) ? 'done' : ''}" style="--c:${p.color}"><i></i>${esc(p.name)}</span>`).join('');
  const w = $('#waiting');
  if (H.pending) {
    const left = [...H.pending.need].map(byId).filter(p => p && p.connected && !H.pending.answers.has(p.id));
    w.innerHTML = left.length ? `<span class="muted">Waiting on</span> ${left.map(p => `<span class="chip" style="--c:${p.color}"><i></i>${esc(p.name)}</span>`).join('')}` : '';
  } else w.innerHTML = '';
}
function setAction(label, fn) {
  const b = $('#actionBtn');
  H.action = fn || null;
  b.hidden = !label; b.textContent = label || '';
}
function guard(fn) {
  return new Promise((res, rej) => {
    H.waiter = { reject: rej };
    fn(v => { H.waiter = null; res(v); });
  });
}
function hostNext(label = 'Next') { return guard(done => setAction(label, () => { setAction(null); done(); })); }
function sleep(ms) { return guard(done => setTimeout(done, ms)); }
function timer(seconds, label = 'Done') {
  return guard(done => {
    let left = seconds; const clock = $('#clock');
    const tick = () => { clock.textContent = left; clock.classList.toggle('low', left <= 5); };
    const fin = () => { clearInterval(iv); clock.textContent = ''; setAction(null); done(); };
    tick(); const iv = setInterval(() => { left--; if (left <= 0) fin(); else tick(); }, 1000);
    H.clockIv = iv;
    setAction(label, fin);
  });
}
function collect(targets, viewFor, opts = {}) {
  return guard(done => {
    const rid = ++H.reqSeq, answers = new Map(), need = new Set();
    for (const p of targets) { const v = viewFor(p); if (!v) continue; need.add(p.id); setView(p, { ...v, rid }); }
    let left = opts.seconds || 0, finished = false;
    const clock = $('#clock'), skip = $('#skipBtn');
    const finish = () => {
      if (finished) return; finished = true;
      clearInterval(iv); clock.textContent = ''; skip.hidden = true; H.pending = null;
      for (const id of need) if (!answers.has(id)) waitView(byId(id), 'Time\'s up! Watch the big screen.');
      renderTop(); done(answers);
    };
    H.pending = {
      rid, answers, need, after: opts.after,
      check() { renderTop(); const live = [...need].filter(id => byId(id)?.connected); if (live.every(id => answers.has(id))) setTimeout(finish, 350); }
    };
    skip.hidden = false; skip.onclick = finish;
    let iv = null;
    if (left) {
      clock.textContent = left;
      iv = setInterval(() => { left--; clock.textContent = Math.max(left, 0); clock.classList.toggle('low', left <= 5); if (left <= 0) finish(); }, 1000);
    }
    H.clockIv = iv;
    H.pending.finish = finish;
    renderTop();
    if (!need.size) finish();
  });
}
function runCleanup() { try { speechSynthesis.cancel(); } catch {} H.cleanup.splice(0).forEach(f => { try { f(); } catch {} }); H.onInput = null; }
function endGame() {
  runCleanup();
  if (H.pending) { const p = H.pending; H.pending = null; p.finish && (p.finish = null); }
  clearInterval(H.clockIv); $('#clock').textContent = ''; $('#skipBtn').hidden = true; setAction(null);
  if (H.waiter) { const w = H.waiter; H.waiter = null; w.reject(new Abort()); }
}

async function promptJar(game, roster) {
  const j = game.jar;
  stage(`<div class="eyebrow">The prompt jar · ${esc(game.name)}</div><h1 class="big">Write the prompts</h1><p class="sub">${esc(j.ask)}. Up to 3 each, one per line. They get played first, so go wild.</p>`);
  const res = await collect(roster, () => ({ kind: 'text', prompt: j.ask, sub: `Up to 3, one per line. Example: ${j.hint}`, max: 400, placeholder: j.hint }), { seconds: 90, after: 'Into the jar. No take-backs.' });
  H.jar[j.key] = [];
  for (const p of roster) for (const line of splitLines(res.get(p.id)).slice(0, 3)) { const t = shapePrompt(j.key, line); if (t) H.jar[j.key].push({ text: t, author: p }); }
  const n = H.jar[j.key].length;
  stage(`<div class="eyebrow">The prompt jar</div><div class="bignum">${n}</div><h2 style="font-size:2em">${n === 1 ? 'prompt' : 'prompts'} in the jar</h2>`);
  await sleep(1800);
}

async function launch(game) {
  const roster = H.players.filter(p => p.connected);
  if (roster.length < game.min) { H.notice = `${game.name} needs at least ${game.min} players. ${roster.length} connected.`; renderLobby(); return; }
  H.notice = '';
  roster.forEach(p => { p.score = 0; p.titles = []; });
  H.players.filter(p => !roster.includes(p)).forEach(p => waitView(p, 'A game is in progress. You\'ll be in the next one.'));
  H.running = { game, roster };
  $('#menuBtn').hidden = false;
  H.jar = {};
  try {
    if (H.settings.jar && game.jar) await promptJar(game, roster);
    await game.run(roster);
  }
  catch (e) { if (!(e instanceof Abort)) { console.error(e); } }
  runCleanup();
  H.running = null; H.pending = null; setAction(null);
  H.players.forEach(p => waitView(p, 'Back in the lobby. Waiting for the host to pick a game.'));
  renderTop(); renderLobby();
}

function intro(game, how) {
  stage(`<div class="eyebrow">Up next</div><h1 class="big">${esc(game)}</h1><p class="sub">${how}</p>`);

}

function leaderboard(roster, title, unit = 'pts') {
  const rows = [...roster].sort((a, b) => b.score - a.score);
  stage(`<div class="eyebrow">Final standings</div><h1 class="big">${esc(title)}</h1>
    <div class="board">${rows.map((p, i) => `<div class="brow"><span class="rank">${i + 1}</span><span style="color:${i ? p.color : 'inherit'}">${esc(p.name)}</span><span class="pts">${p.score} ${unit}</span></div>`).join('')}</div>`);
  rows.forEach((p, i) => waitView(p, `You finished #${i + 1} with ${p.score} ${unit}.`));
  return hostNext('Back to menu');
}

/* ---------------- Game: Superlatives Tournament ---------------- */
async function runSuperlatives(roster) {
  await intro('Superlatives Tournament', 'Six prompts. Vote for whoever fits best. Most votes earns the title. Voting with the crowd scores a point.');
  const prompts = draw('superlatives', 6).map(i => i.text);
  for (const [i, pr] of prompts.entries()) {
    stage(`<div class="eyebrow">Superlative ${i + 1} of ${prompts.length}</div><h1 class="big">${esc(pr)}</h1><p class="sub">Vote on your phone. You can't vote for yourself.</p>`);
    say(pr);
    const ans = await collect(roster, p => ({
      kind: 'choose', prompt: pr, sub: 'Who is it?',
      options: roster.filter(o => o.id !== p.id).map(o => ({ id: o.id, label: o.name, color: o.color }))
    }), { seconds: 30 });
    const tally = new Map(roster.map(p => [p.id, 0]));
    for (const v of ans.values()) if (tally.has(v)) tally.set(v, tally.get(v) + 1);
    const max = Math.max(0, ...tally.values());
    const winners = max ? roster.filter(p => tally.get(p.id) === max) : [];
    winners.forEach(w => w.titles.push(pr.replace(/^Most likely to /, '')));
    for (const [pid, v] of ans) if (winners.some(w => w.id === v)) byId(pid).score++;
    const sorted = [...roster].sort((a, b) => tally.get(b.id) - tally.get(a.id));
    stage(`<div class="eyebrow">${esc(pr)}</div>
      ${winners.length ? `<div class="winner" style="--c:${winners[0].color}">${winners.map(w => esc(w.name)).join(' &amp; ')}</div>` : `<div class="winner" style="--c:var(--muted)">Nobody voted</div>`}
      <div class="bars">${sorted.map(p => `<div class="bar" style="--c:${p.color}"><span>${esc(p.name)}</span><div class="track"><div class="fill" data-w="${max ? tally.get(p.id) / max * 100 : 0}"></div></div><span class="n">${tally.get(p.id)}</span></div>`).join('')}</div>`);
    animateFills();
    roster.forEach(p => waitView(p, winners.includes(p) ? 'You won this one. Wear it proudly.' : 'Results are on the big screen.'));
    await hostNext(i < prompts.length - 1 ? 'Next superlative' : 'See the titles');
  }
  const rows = [...roster].sort((a, b) => b.titles.length - a.titles.length);
  stage(`<div class="eyebrow">The titles</div><h1 class="big" style="font-size:clamp(26px,3vw,70px)">Tonight's honors</h1>
    <div class="titlewall">${rows.map(p => `<div class="tcard" style="--c:${p.color}"><h3>${esc(p.name)}</h3>
      ${p.titles.length ? `<ul>${p.titles.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : `<span class="none">No titles. Mysterious.</span>`}
      <span class="muted">${p.score} crowd ${p.score === 1 ? 'point' : 'points'}</span></div>`).join('')}</div>`);
  roster.forEach(p => waitView(p, p.titles.length ? `Your titles: ${p.titles.join(' • ')}` : 'No titles this time.'));
  await hostNext('Back to menu');
}

/* ---------------- Game: Hot Takes Draft ---------------- */
async function runHotTakes(roster) {
  await intro('Hot Takes Draft', 'You get three spicy opinions. Pick one to defend out loud for 45 seconds. The room votes on how convinced they are.');
  const deck = draw('hottakes', roster.length * 3).map(i => i.text), hands = new Map();
  roster.forEach((p, i) => hands.set(p.id, deck.slice(i * 3, i * 3 + 3)));
  stage(`<div class="eyebrow">The draft</div><h1 class="big">Pick the take you'll defend</h1><p class="sub">Choose the one you can argue with a straight face. Or the one you can't.</p>`);
  const picks = await collect(roster, p => ({
    kind: 'choose', prompt: 'Pick your take to defend', sub: 'You will argue for it out loud.',
    options: hands.get(p.id).map((t, i) => ({ id: i, label: t }))
  }), { seconds: 40, after: 'Drafted. Start planning your argument.' });
  const order = shuffle(roster);
  for (const [i, p] of order.entries()) {
    const hand = hands.get(p.id); const take = hand[Number(picks.get(p.id)) || 0] || hand[0];
    stage(`<div class="eyebrow">Defense ${i + 1} of ${order.length}</div><div class="winner" style="--c:${p.color};font-size:1.8em">${esc(p.name)} will defend</div><h1 class="big quote">${esc(take)}</h1>`);
    say(`${p.name} will now defend: ${take}`);
    roster.forEach(o => waitView(o, o === p ? 'You\'re up! Defend your take out loud.' : `Listen to ${p.name}. Heckling is allowed.`));
    await hostNext('Start the 45s clock');
    await timer(45, 'Done talking');
    stage(`<div class="eyebrow">Verdict</div><h1 class="big quote">${esc(take)}</h1><p class="sub">Did ${esc(p.name)} convince you? Vote on your phone.</p>`);
    const votes = await collect(roster.filter(o => o !== p), () => ({
      kind: 'choose', prompt: `Did ${p.name} convince you?`, sub: take,
      options: [{ id: 2, label: 'Completely convinced' }, { id: 1, label: 'Kinda, sure' }, { id: 0, label: 'Absolutely not' }]
    }), { seconds: 20 });
    const pts = [...votes.values()].reduce((a, b) => a + (Number(b) || 0), 0);
    const pct = votes.size ? Math.round(pts / (votes.size * 2) * 100) : 0;
    p.score += pts;
    const label = pct >= 75 ? 'A new movement is born' : pct >= 45 ? 'The room is torn' : pct > 0 ? 'A few believers' : 'Nobody is buying it';
    stage(`<div class="eyebrow">${esc(p.name)} converted</div><div class="bignum">${pct}%</div><div class="meter"><div data-w="${pct}"></div></div><h2 style="font-size:2em">${label}</h2><p class="sub">+${pts} points</p>`);
    animateFills();
    await hostNext(i < order.length - 1 ? 'Next defense' : 'Final standings');
  }
  await leaderboard(roster, 'Most persuasive');
}

/* ---------------- Game: Group Chat Simulator ---------------- */
async function runGroupChat(roster) {
  await intro('Group Chat Simulator', 'Everyone gets a secret character. Text the group chat in character for two rounds. Then guess which friend was behind each character.');
  const scenario = draw('scenarios', 1)[0].text;
  const arch = draw('archetypes', roster.length).map(i => i.text), al = shuffle(ALIASES);
  const role = new Map(roster.map((p, i) => [p.id, { arch: arch[i], alias: al[i], color: ALIAS_COLORS[i % ALIAS_COLORS.length] }]));
  const thread = [];
  const chatHtml = (dimExcept) => `<div class="phoneframe" id="chat"><div class="chathead">${esc(scenario)} · ${roster.length} people</div>
    ${thread.map(m => { const r = role.get(m.pid); return `<div class="msg ${dimExcept && dimExcept !== m.pid ? 'dim' : ''}" style="--c:${r.color}"><div class="av">${esc(r.alias[0])}</div><div><div class="who"><b>${esc(r.alias)}</b> · ${esc(r.arch)}</div><div class="bub">${esc(m.text)}</div></div></div>`; }).join('') || '<div class="muted" style="text-align:center;padding:2em 0">No messages yet</div>'}</div>`;
  const cast = () => `<div class="titlewall" style="grid-template-columns:repeat(auto-fill,minmax(12em,1fr))">${roster.map(p => { const r = role.get(p.id); return `<div class="tcard" style="--c:${r.color}"><h3>${esc(r.alias)}</h3><span>${esc(r.arch)}</span></div>`; }).join('')}</div>`;
  for (const round of [1, 2]) {
    stage(`<div class="chatwrap"><div style="display:grid;gap:1em"><div class="eyebrow">Round ${round} of 2</div><h1 class="big" style="font-size:clamp(26px,3vw,72px)">${round === 1 ? esc(scenario) : 'Reply to the chaos'}</h1><p class="sub">Check your phone for your secret character. Stay in character.</p>${cast()}</div>${chatHtml()}</div>`);
    const recent = thread.slice(-3).map(m => `${role.get(m.pid).alias}: ${m.text}`).join('\n');
    const msgs = await collect(roster, p => {
      const r = role.get(p.id);
      return { kind: 'text', prompt: `You are ${r.arch}`, sub: round === 1 ? `Your chat name is ${r.alias}. The topic: ${scenario}. Write your first message.` : `Reply to the chat as ${r.alias}. Recent messages:\n${recent}`, max: 140, placeholder: 'Type your message' };
    }, { seconds: 75, after: 'Sent. Watch it land on the big screen.' });
    const fresh = shuffle(roster.filter(p => String(msgs.get(p.id) || '').trim())).map(p => ({ pid: p.id, text: String(msgs.get(p.id)).trim().slice(0, 140) }));
    for (const m of fresh) { thread.push(m); const c = $('#chat'); if (c) { c.outerHTML = chatHtml(); const n = $('#chat'); n.scrollTop = n.scrollHeight; } await sleep(1300); }
    await hostNext(round === 1 ? 'Round 2' : 'Start guessing');
  }
  for (const [i, owner] of shuffle(roster).entries()) {
    const r = role.get(owner.id);
    stage(`<div class="chatwrap"><div style="display:grid;gap:1em"><div class="eyebrow">Unmask ${i + 1} of ${roster.length}</div><h1 class="big" style="font-size:clamp(26px,3.4vw,80px)">Who is <span style="color:${r.color}">${esc(r.alias)}</span>?</h1><p class="sub">${esc(r.arch)}. Guess on your phone.</p></div>${chatHtml(owner.id)}</div>`);
    const guesses = await collect(roster, p => ({
      kind: 'choose', prompt: `Who is ${r.alias}?`, sub: p === owner ? 'This one is you! Pick anyone to keep your cover. Your vote doesn\'t count.' : r.arch,
      options: roster.filter(o => o !== p).map(o => ({ id: o.id, label: o.name, color: o.color }))
    }), { seconds: 25 });
    guesses.delete(owner.id);
    const right = [...guesses].filter(([, v]) => v === owner.id).map(([k]) => byId(k));
    right.forEach(p => p.score++);
    owner.score += guesses.size - right.length;
    stage(`<div class="eyebrow">${esc(r.alias)} · ${esc(r.arch)}</div><div class="winner" style="--c:${owner.color};font-size:4em">${esc(owner.name)}</div>
      <p class="sub">${right.length ? `Spotted by ${right.map(p => esc(p.name)).join(', ')}.` : 'Nobody figured it out.'} ${esc(owner.name)} fooled ${guesses.size - right.length}.</p>`);
    await hostNext(i < roster.length - 1 ? 'Next unmask' : 'Final standings');
  }
  await leaderboard(roster, 'Best undercover texter');
}

/* ---------------- Game: Unpopular Opinions Bingo ---------------- */
async function runBingo(roster) {
  await intro('Unpopular Opinions Bingo', 'Confess which statements you agree with. Nobody sees your answers. A square gets called when some of the room agrees, but not everyone. Three in a row wins.');
  const pool = draw('bingo', 18).map(i => i.text);
  stage(`<div class="eyebrow">Confession booth</div><h1 class="big">Tap everything you secretly agree with</h1><p class="sub">Answers are anonymous. Only totals show up on screen.</p>`);
  const conf = await collect(roster, () => ({ kind: 'multi', prompt: 'Confess, anonymously', sub: 'Tap every statement you agree with.', items: pool }), { seconds: 120, after: 'Confession received. Your secrets are safe.' });
  const total = conf.size;
  const counts = pool.map((_, i) => [...conf.values()].filter(a => Array.isArray(a) && a.includes(i)).length);
  const cards = new Map(roster.map(p => [p.id, pick(pool.map((_, i) => i), 9)]));
  const called = new Set();
  const lines = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  const hasLine = id => { const c = cards.get(id); return lines.some(l => l.every(k => called.has(c[k]))); };
  const sendCards = () => roster.forEach(p => setView(p, { kind: 'bingo', title: 'Your card', cells: cards.get(p.id).map(i => pool[i]), marked: cards.get(p.id).map(i => called.has(i)) }));
  const minis = () => `<div class="minicards">${roster.map(p => `<div class="mini" style="--c:${p.color}"><div class="g">${cards.get(p.id).map(i => `<i class="${called.has(i) ? 'on' : ''}"></i>`).join('')}</div>${esc(p.name)}</div>`).join('')}</div>`;
  sendCards();
  for (const [n, i] of shuffle(pool.map((_, i) => i)).entries()) {
    stage(`<div class="eyebrow">Statement ${n + 1}</div><h1 class="big quote">${esc(pool[i])}</h1><p class="sub">How many of you agree?</p>${minis()}`);
    await hostNext('Reveal');
    const c = counts[i], hit = c >= 1 && c < total;
    if (hit) called.add(i);
    const verdict = hit ? 'Called! Check your card.' : c === 0 ? 'Nobody. Not called.' : 'Everyone agrees. Too easy, not called.';
    sendCards();
    const winners = roster.filter(p => hasLine(p.id));
    stage(`<div class="eyebrow">${esc(pool[i])}</div><div class="bignum">${c}<span style="font-size:.35em;color:var(--muted)"> of ${total}</span></div><h2 style="font-size:2em;color:${hit ? 'var(--mint)' : 'var(--muted)'}">${verdict}</h2>${minis()}`);
    if (winners.length) {
      await hostNext('Who has bingo?');
      winners.forEach(w => w.score++);
      stage(`<div class="eyebrow">Bingo</div><div class="bignum">BINGO!</div><div class="winner" style="--c:${winners[0].color}">${winners.map(w => esc(w.name)).join(' &amp; ')}</div><p class="sub">${called.size} statements called out of ${n + 1} revealed.</p>${minis()}`);
      roster.forEach(p => waitView(p, winners.includes(p) ? 'BINGO! You win.' : `${winners.map(w => w.name).join(' & ')} got bingo.`));
      await hostNext('Back to menu');
      return;
    }
    await hostNext('Next statement');
  }
  stage(`<div class="eyebrow">Out of statements</div><h1 class="big">No bingo this time</h1><p class="sub">This room agrees on too much. Or too little.</p>${minis()}`);
  await hostNext('Back to menu');
}

// Shape a raw line for a pool. Returns null when the line can't be used.
function shapePrompt(key, t) {
  t = t.trim().slice(0, 200);
  if (!t) return null;
  if (key === 'superlatives' && !/^most\b/i.test(t)) t = 'Most likely to ' + t.replace(/^to\s+/i, '');
  if (key === 'superlatives') t = t.replace(/[.?!]+$/, '');
  if (key === 'wiki' && !/\s=\s|=/.test(t)) return null;
  return t;
}
function parseSecret(t) { const m = t.match(/^([^:]{1,30}):\s*(.+)$/); return m ? { cat: m[1].trim(), word: m[2].trim() } : { cat: 'Anything', word: t.trim() }; }
function parseWiki(t) { const i = t.indexOf('='); return { word: t.slice(0, i).trim(), def: t.slice(i + 1).trim() }; }

// Draw n prompts: jar + custom first, then the spice pool, then anything as a fallback.
function draw(key, n, ok = () => true) {
  const lvl = H.settings.spice, P = PACKS[key] || {}, base = BASE_PACKS[key] || [];
  const pool = lvl === 'unhinged' ? [...(P.spicy || []), ...(P.unhinged || [])] : lvl === 'spicy' ? [...base, ...(P.spicy || [])] : base;
  const custom = splitLines(H.settings.custom[key]).map(t => ({ text: shapePrompt(key, t), author: null })).filter(i => i.text);
  const jar = (H.jar[key] || []);
  const all = [...base, ...(P.spicy || []), ...(P.unhinged || [])].map(text => ({ text, author: null }));
  const ordered = [...shuffle([...jar, ...custom]), ...shuffle(pool.map(text => ({ text, author: null }))), ...shuffle(all)];
  const out = [], seen = new Set();
  for (const it of ordered) {
    const k = it.text.toLowerCase();
    if (seen.has(k) || !ok(it)) continue;
    seen.add(k); out.push(it);
    if (out.length >= n) break;
  }
  if (H.jar[key]) H.jar[key] = H.jar[key].filter(it => !out.includes(it));
  return out;
}

/* ---------------- Game: Fake Wikipedia ---------------- */
async function runFakeWiki(roster) {
  await intro('Fake Wikipedia', 'A real but obscure word appears. Write a fake definition good enough to fool people, then find the real one. Finding the truth is worth 2 points. Each person you fool is worth 1.');
  const words = draw('wiki', 3).map(i => ({ ...parseWiki(i.text), author: i.author }));
  for (const [r, w] of words.entries()) {
    stage(`<div class="eyebrow">Word ${r + 1} of ${words.length}</div><h1 class="big quote">${esc(w.word)}</h1><p class="sub">Write a believable fake definition on your phone.</p>`);
    const defs = await collect(roster, () => ({ kind: 'text', prompt: w.word, sub: 'Write a fake definition that sounds real.', max: 120, placeholder: 'noun. A …' }), { seconds: 75, after: 'Nice. Now look innocent.' });
    let entries = [{ id: 'real', text: w.def, author: null }];
    const lucky = [];
    for (const p of roster) {
      const t = String(defs.get(p.id) || '').trim();
      if (!t) continue;
      if (norm(t) === norm(w.def)) { if (p !== w.author) { p.score += 2; lucky.push(p); } continue; }
      if (entries.some(e => norm(e.text) === norm(t))) continue;
      entries.push({ id: p.id, text: t, author: p });
    }
    entries = shuffle(entries);
    stage(`<div class="eyebrow">Which one is real?</div><h1 class="big quote" style="font-size:clamp(26px,3vw,70px)">${esc(w.word)}</h1>
      <div class="deflist">${entries.map((e, i) => `<div class="def"><span class="dl">${letter(i)}</span><span>${esc(e.text)}</span></div>`).join('')}</div>`);
    const votes = await collect(roster, p => ({
      kind: 'choose', prompt: `What does "${w.word}" mean?`, sub: p === w.author ? 'You wrote this word, so your vote doesn\'t count. Pick anything to keep the room guessing.' : 'Your own definition is hidden from you.',
      options: entries.filter(e => e.id !== p.id).map(e => ({ id: e.id, label: e.text }))
    }), { seconds: 45 });
    if (w.author) votes.delete(w.author.id);
    const pickedBy = id => [...votes].filter(([, v]) => v === id).map(([k]) => byId(k));
    for (const [pid, v] of votes) { if (v === 'real') byId(pid).score += 2; else { const e = entries.find(e => e.id === v); if (e && e.author) e.author.score += 1; } }
    stage(`<div class="eyebrow">${esc(w.word)}</div>
      <div class="deflist">${entries.map((e, i) => { const by = pickedBy(e.id); return `<div class="def ${e.id === 'real' ? 'real' : ''}"><span class="dl">${letter(i)}</span><span>${esc(e.text)}
        <small>${e.id === 'real' ? 'THE REAL DEFINITION' : 'Written by ' + nameList([e.author])}${by.length ? ` · picked by ${nameList(by)}` : ''}</small></span></div>`; }).join('')}</div>
      ${lucky.length ? `<p class="sub">${nameList(lucky)} actually knew it. +2.</p>` : ''}`);
    await hostNext(r < words.length - 1 ? 'Next word' : 'Final standings');
  }
  await leaderboard(roster, 'Most convincing liar');
}

/* ---------------- Game: Who Wrote This? ---------------- */
async function runWhoWrote(roster) {
  await intro('Who Wrote This?', 'Answer a personal question anonymously. Then guess who wrote each answer. A correct guess is worth 1 point. If nobody guesses yours, you get 2.');
  const prompts = draw('who', roster.length <= 4 ? 2 : 1).map(i => i.text);
  for (const [r, q] of prompts.entries()) {
    stage(`<div class="eyebrow">Prompt ${r + 1} of ${prompts.length}</div><h1 class="big">${esc(q)}</h1><p class="sub">Answer on your phone. Nobody will see it's yours.</p>`);
    const ans = await collect(roster, () => ({ kind: 'text', prompt: q, sub: 'Keep it short. Make it hard to guess, or don\'t.', max: 100 }), { seconds: 60, after: 'Got it. Poker face on.' });
    const items = shuffle(roster.filter(p => String(ans.get(p.id) || '').trim()).map(p => ({ author: p, text: String(ans.get(p.id)).trim() })));
    for (const [i, it] of items.entries()) {
      stage(`<div class="eyebrow">${esc(q)} · ${i + 1} of ${items.length}</div><h1 class="big quote">${esc(it.text)}</h1><p class="sub">Who wrote this?</p>`);
      const g = await collect(roster, p => ({
        kind: 'choose', prompt: 'Who wrote this?', sub: p === it.author ? 'This is yours! Pick anyone to keep your cover. Your vote doesn\'t count.' : it.text,
        options: roster.filter(o => o !== p).map(o => ({ id: o.id, label: o.name, color: o.color }))
      }), { seconds: 25 });
      g.delete(it.author.id);
      const right = [...g].filter(([, v]) => v === it.author.id).map(([k]) => byId(k));
      right.forEach(p => p.score++);
      if (!right.length) it.author.score += 2;
      stage(`<div class="eyebrow">${esc(q)}</div><h1 class="big quote" style="font-size:clamp(24px,2.6vw,60px)">${esc(it.text)}</h1>
        <div class="winner" style="--c:${it.author.color};font-size:3.5em">${esc(it.author.name)}</div>
        <p class="sub">${right.length ? `Spotted by ${nameList(right)}.` : `Nobody guessed it. ${esc(it.author.name)} gets 2 points.`}</p>`);
      await hostNext(i < items.length - 1 ? 'Next answer' : (r < prompts.length - 1 ? 'Next prompt' : 'Final standings'));
    }
  }
  await leaderboard(roster, 'Best detective');
}

/* ---------------- Game: Herd Mentality, but Meaner ---------------- */
async function runHerd(roster) {
  await intro('Herd Mentality, but Meaner', 'Type the answer you think most people will give. The biggest herd scores a point. If exactly one person is alone with a weird answer, they lose a point and get the Cow of Shame. First to 5 wins.');
  let cow = null;
  for (const [r, q] of draw('herd', 12).map(i => i.text).entries()) {
    stage(`<div class="eyebrow">Round ${r + 1}${cow ? ` · <span style="color:var(--tang)">${esc(cow.name)} has the Cow of Shame</span>` : ''}</div><h1 class="big">${esc(q)}</h1><p class="sub">Think like the herd.</p>`);
    const ans = await collect(roster, () => ({ kind: 'text', prompt: q, sub: 'Match the majority.', max: 40 }), { seconds: 30 });
    const groups = new Map();
    for (const p of roster) {
      const raw = String(ans.get(p.id) || '').trim(); if (!raw) continue;
      const k = norm(raw) || raw.toLowerCase();
      if (!groups.has(k)) groups.set(k, { label: raw, players: [] });
      groups.get(k).players.push(p);
    }
    const sorted = [...groups.values()].sort((a, b) => b.players.length - a.players.length);
    const max = sorted[0]?.players.length || 0;
    const top = sorted.filter(g => g.players.length === max);
    const herd = top.length === 1 && max > 1 ? top[0] : null;
    if (herd) herd.players.forEach(p => p.score++);
    const loners = sorted.filter(g => g.players.length === 1);
    let shamed = null;
    if (loners.length === 1 && groups.size > 1) { shamed = loners[0].players[0]; shamed.score = Math.max(0, shamed.score - 1); cow = shamed; }
    const silent = roster.filter(p => !String(ans.get(p.id) || '').trim());
    stage(`<div class="eyebrow">${esc(q)}</div>
      <h2 style="font-size:2em">${herd ? `The herd says <span style="color:var(--butter)">${esc(herd.label)}</span>` : 'No clear herd. Nobody scores.'}</h2>
      <div class="herds">${sorted.map(g => `<div class="herdcard ${g === herd ? 'win' : ''} ${g.players[0] === shamed && g.players.length === 1 ? 'cow' : ''}">
        <div class="hl">${esc(g.label)}</div><div class="hn">${g.players.length}</div><div>${nameList(g.players)}</div>
        ${g.players[0] === shamed && g.players.length === 1 ? '<div class="cowtag">COW OF SHAME · −1</div>' : ''}</div>`).join('')}
        ${silent.length ? `<div class="herdcard"><div class="hl muted">No answer</div><div>${nameList(silent)}</div></div>` : ''}</div>
      <div class="minicards">${[...roster].sort((a, b) => b.score - a.score).map(p => `<span class="chip" style="--c:${p.color}"><i></i>${esc(p.name)} · ${p.score}</span>`).join('')}</div>`);
    const winners = roster.filter(p => p.score >= 5 && p !== cow);
    if (winners.length) {
      await hostNext('And the winner is…');
      stage(`<div class="eyebrow">Leader of the herd</div><div class="bignum">${winners.map(w => esc(w.name)).join(' &amp; ')}</div><p class="sub">${cow ? `${esc(cow.name)} leaves with the Cow of Shame.` : ''}</p>`);
      await hostNext('Final standings');
      break;
    }
    await hostNext('Next prompt');
  }
  await leaderboard(roster, 'Most herd-minded');
}

/* ---------------- Game: One of Us Isn't Briefed ---------------- */
async function runBriefed(roster) {
  await intro('One of Us Isn\'t Briefed', 'Everyone gets the secret word except one faker, who only gets the category. Everyone gives a one-word clue, then you vote on who the faker is. If the faker gets caught, they can still steal the round by guessing the word.');
  for (let r = 0; r < 3; r++) {
    const faker = pick(roster, 1)[0];
    const secret = parseSecret(draw('secrets', 1, it => it.author !== faker)[0].text);
    stage(`<div class="eyebrow">Round ${r + 1} of 3 · Category: ${esc(secret.cat)}</div><h1 class="big">Check your phone</h1><p class="sub">Everyone knows the secret word. Almost everyone.</p>`);
    const clues = await collect(roster, p => p === faker
      ? { kind: 'text', prompt: 'You\'re not briefed!', sub: `You are the faker. The category is ${secret.cat}. Give a one-word clue that blends in.`, max: 24 }
      : { kind: 'text', prompt: `The secret word is ${secret.word}`, sub: `Category: ${secret.cat}. Give a one-word clue. Too obvious and the faker learns the word.`, max: 24 },
      { seconds: 45, after: 'Clue locked in.' });
    stage(`<div class="eyebrow">Category: ${esc(secret.cat)}</div><h1 class="big" style="font-size:clamp(26px,3vw,70px)">The clues</h1>
      <div class="cluegrid">${roster.map(p => `<div class="clue" style="--c:${p.color}"><span>${esc(p.name)}</span><b>${esc(clues.get(p.id) || '…')}</b></div>`).join('')}</div>
      <p class="sub">Discuss out loud. Who's faking it?</p>`);
    roster.forEach(p => waitView(p, p === faker ? 'Stay calm. Act briefed.' : 'Discuss! Who is the faker?'));
    await timer(60, 'Start voting');
    const votes = await collect(roster, p => ({ kind: 'choose', prompt: 'Who isn\'t briefed?', options: roster.filter(o => o !== p).map(o => ({ id: o.id, label: o.name, color: o.color })) }), { seconds: 30 });
    const tally = new Map(); for (const v of votes.values()) tally.set(v, (tally.get(v) || 0) + 1);
    const max = Math.max(0, ...tally.values());
    const tops = [...tally].filter(([, n]) => n === max).map(([id]) => id);
    const accused = tops.length === 1 ? byId(tops[0]) : null;
    const crew = roster.filter(p => p !== faker);
    let result;
    if (accused === faker) {
      stage(`<div class="eyebrow">Caught!</div><div class="winner" style="--c:${faker.color};font-size:4em">${esc(faker.name)}</div><p class="sub">was the faker. One last chance: they can steal the round by guessing the word.</p>`);
      const g = await collect([faker], () => ({ kind: 'text', prompt: 'Guess the secret word', sub: `Category: ${secret.cat}`, max: 30 }), { seconds: 30 });
      const guess = String(g.get(faker.id) || '').trim();
      if (guess && norm(guess) === norm(secret.word)) { faker.score += 1; result = `${esc(faker.name)} guessed <b>${esc(secret.word)}</b> and steals the round!`; }
      else { crew.forEach(p => p.score++); result = `${esc(faker.name)} guessed "${esc(guess || 'nothing')}". The crew wins. +1 each.`; }
    } else {
      faker.score += 2;
      result = `${accused ? `You accused ${esc(accused.name)}.` : 'The vote was split.'} The faker escapes with 2 points.`;
    }
    stage(`<div class="eyebrow">The word was</div><div class="bignum" style="font-size:clamp(50px,7vw,160px)">${esc(secret.word)}</div>
      <h2 style="font-size:1.8em">Faker: <span style="color:${faker.color}">${esc(faker.name)}</span></h2><p class="sub">${result}</p>
      <div class="minicards">${roster.map(p => `<span class="chip" style="--c:${p.color}"><i></i>${esc(p.name)} → ${esc(byId(votes.get(p.id))?.name || '—')}</span>`).join('')}</div>`);
    roster.forEach(p => waitView(p, `The word was ${secret.word}.`));
    await hostNext(r < 2 ? 'Next round' : 'Final standings');
  }
  await leaderboard(roster, 'Best poker face');
}

/* ---------------- Real-time helpers ---------------- */
function runLoop(step) {
  return guard(done => {
    let last = performance.now(), raf = 0, stopped = false;
    const tick = now => {
      if (stopped) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (step(dt, now)) { stopped = true; done(); } else raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    H.cleanup.push(() => { stopped = true; cancelAnimationFrame(raf); });
  });
}
function padAll(roster, text, color) { roster.forEach(p => send(p, { t: 'pad', text, color })); }
async function countIn(title, sub) {
  for (const n of [3, 2, 1]) { stage(`<div class="eyebrow">${esc(title)}</div><div class="bignum">${n}</div><p class="sub">${sub}</p>`); await sleep(900); }
}
function bestRecord(key, score) {
  const k = 'couchriot-best-' + key, prev = Number(store.get(k)) || 0;
  if (score > prev) store.set(k, String(score));
  return { prev, best: Math.max(prev, score), isNew: score > prev };
}

/* ---------------- Game: Hot Potato Phone ---------------- */
async function runHotPotato(roster) {
  await intro('Hot Potato Phone', 'Whoever holds the bomb answers the category on their phone, then passes it on. No repeats. The fuse is secret. Survive the explosion to score.');
  const cats = draw('potato', 3).map(i => i.text);
  for (let r = 0; r < 3; r++) {
    const cat = cats[r] || pick(POTATO_CATS, 1)[0], used = [];
    let holder = pick(roster, 1)[0], exploded = false;
    const fuse = isUnhinged() ? 15000 + Math.random() * 20000 : 25000 + Math.random() * 25000, t0 = Date.now();
    const tf = setTimeout(() => { exploded = true; H.pending?.finish?.(); }, fuse);
    H.cleanup.push(() => clearTimeout(tf));
    const render = () => {
      const spd = Math.max(0.22, 1.1 - (Date.now() - t0) / 45000);
      stage(`<div class="eyebrow">Round ${r + 1} of 3</div><h1 class="big">${esc(cat)}</h1>
        <div class="potato"><div class="bomb" style="--spd:${spd}s"></div><div><div class="sub">The bomb is with</div><div class="winner" style="--c:${holder.color};font-size:3.2em">${esc(holder.name)}</div></div></div>
        <div class="usedlist">${used.map(u => `<span class="chip" style="--c:${u.p.color}"><i></i>${esc(u.text)}</span>`).join('')}</div>`);
    };
    while (!exploded) {
      render();
      roster.forEach(o => o !== holder && waitView(o, `${holder.name} has the bomb!`));
      let err = '', answer = null;
      while (!exploded) {
        const res = await collect([holder], () => ({ kind: 'text', prompt: cat, sub: err || 'Answer fast, then pass the bomb.', max: 40 }), { after: 'Quick, pick who gets it next…' });
        if (exploded) break;
        const a = String(res.get(holder.id) || '').trim();
        if (!a) { err = 'Type something!'; continue; }
        if (used.some(u => norm(u.text) === norm(a))) { err = `"${a}" was already said! Try again.`; continue; }
        answer = a; break;
      }
      if (exploded) break;
      used.push({ text: answer, p: holder }); render();
      if (isUnhinged() && Math.random() < 0.22) {
        const others = roster.filter(o => o !== holder);
        holder = pick(others, 1)[0];
        stage(`<div class="eyebrow">${esc(cat)}</div><div class="bignum boom">THE BOMB JUMPED</div><div class="winner" style="--c:${holder.color}">to ${esc(holder.name)}</div>`);
        await sleep(1300);
        continue;
      }
      const tg = await collect([holder], () => ({ kind: 'choose', prompt: 'Pass the bomb to…', options: roster.filter(o => o !== holder).map(o => ({ id: o.id, label: o.name, color: o.color })) }));
      if (exploded) break;
      holder = byId(tg.get(holder.id)) || holder;
    }
    clearTimeout(tf);
    roster.forEach(o => { if (o !== holder) o.score++; });
    stage(`<div class="eyebrow">${esc(cat)} · ${used.length} answers</div><div class="bignum boom">BOOM</div><div class="winner" style="--c:${holder.color}">${esc(holder.name)} was holding it</div><p class="sub">Everyone else survives. +1.</p>`);
    roster.forEach(o => waitView(o, o === holder ? 'BOOM. You were holding the bomb.' : `BOOM! ${holder.name} exploded. You survived.`));
    await hostNext(r < 2 ? 'Next round' : 'Final standings');
  }
  await leaderboard(roster, 'Steadiest hands', 'survived');
}

/* ---------------- Game: Red Light, Green Light ---------------- */
async function runRedLight(roster) {
  await intro('Red Light, Green Light', 'Hold the button on your phone to run. When the light turns red, let go right away. Anyone caught moving is out for the round. First across wins 3 points, second 2, everyone else who finishes 1.');
  for (let r = 0; r < 3; r++) {
    const st = new Map(roster.map(p => [p.id, { x: 0, hold: false, out: false, done: false, place: 0 }]));
    H.onInput = (p, v) => { const s = st.get(p.id); if (s) s.hold = !!v; };
    roster.forEach(p => setView(p, { kind: 'pad', mode: 'hold', title: `Round ${r + 1} of 3`, label: 'HOLD TO RUN', sub: 'Let go the moment it turns red.' }));
    await countIn(`Round ${r + 1} of 3`, 'Fingers on the button.');
    stage(`<div class="rl"><div class="rlbanner" id="rlb"></div><div class="lanes">${roster.map(p => `<div class="lane" style="--c:${p.color}"><span class="lname">${esc(p.name)}</span><div class="ltrack"><i id="dot-${p.id}"></i></div></div>`).join('')}</div></div>`);
    const banner = $('#rlb');
    let light = 'green', phaseEnd = 0, phaseStart = 0, places = 0, elapsed = 0;
    const setLight = (l, now) => {
      phaseStart = now;
      const psych = l === 'green' && light === 'turning';
      light = l;
      phaseEnd = now + (l === 'green' ? (isUnhinged() ? 700 + Math.random() * 3000 : 1500 + Math.random() * 2500) : l === 'turning' ? 650 : l === 'backwards' ? 1500 + Math.random() * 1200 : 1500 + Math.random() * 1500);
      banner.className = 'rlbanner ' + l;
      banner.textContent = l === 'green' ? (psych ? 'PSYCH! GREEN LIGHT' : 'GREEN LIGHT') : l === 'turning' ? 'TURNING…' : l === 'backwards' ? 'BACKWARDS LIGHT' : 'RED LIGHT';
      padAll(roster, l === 'backwards' ? 'BACKWARDS! Holding moves you back' : banner.textContent, l === 'green' ? '#5fe0b5' : l === 'turning' ? '#ffd84d' : l === 'backwards' ? '#ff4fa3' : '#ff5d5d');
    };
    await runLoop((dt, now) => {
      if (!phaseStart) setLight('green', now);
      elapsed += dt;
      if (now >= phaseEnd) {
        const u = isUnhinged(), r = Math.random();
        setLight(light === 'green' ? 'turning' : light === 'turning' ? (u && r < 0.35 ? 'green' : 'red') : light === 'red' ? (u && r < 0.3 ? 'backwards' : 'green') : 'green', now);
      }
      for (const p of roster) {
        const s = st.get(p.id); if (s.out || s.done) continue;
        if (light === 'red' && now - phaseStart > 250 && s.hold) {
          s.out = true; send(p, { t: 'pad', text: 'CAUGHT! You\'re out.', color: '#ff5d5d' });
        } else if (s.hold && light === 'backwards') {
          s.x = Math.max(0, s.x - dt * 13);
        } else if (s.hold && light !== 'red') {
          s.x = Math.min(100, s.x + dt * 13);
          if (s.x >= 100) { s.done = true; s.place = ++places; send(p, { t: 'pad', text: `Finished #${s.place}!`, color: '#5fe0b5' }); }
        }
        const dot = document.getElementById('dot-' + p.id);
        if (dot) { dot.style.left = `calc(${s.x}% - ${s.x * 0.018}em)`; dot.className = s.out ? 'out' : s.done ? 'done' : s.hold ? 'run' : ''; }
      }
      return roster.every(p => st.get(p.id).out || st.get(p.id).done) || elapsed > 60;
    });
    H.onInput = null;
    const fin = roster.filter(p => st.get(p.id).done).sort((a, b) => st.get(a.id).place - st.get(b.id).place);
    fin.forEach((p, i) => p.score += i === 0 ? 3 : i === 1 ? 2 : 1);
    const outs = roster.filter(p => st.get(p.id).out);
    stage(`<div class="eyebrow">Round ${r + 1} results</div>
      <div class="board">${fin.map((p, i) => `<div class="brow"><span class="rank">${i + 1}</span><span style="color:${i ? p.color : 'inherit'}">${esc(p.name)}</span><span class="pts">+${i === 0 ? 3 : i === 1 ? 2 : 1}</span></div>`).join('') || '<p class="sub">Nobody made it across.</p>'}</div>
      ${outs.length ? `<p class="sub">Caught moving: ${nameList(outs)}</p>` : ''}`);
    roster.forEach(p => waitView(p, st.get(p.id).done ? `You finished #${st.get(p.id).place}.` : st.get(p.id).out ? 'Caught moving. Next round!' : 'Time ran out.'));
    await hostNext(r < 2 ? 'Next round' : 'Final standings');
  }
  await leaderboard(roster, 'Fastest feet');
}

/* ---------------- Game: Crowd Pilot ---------------- */
async function runCrowdPilot(roster) {
  await intro('Crowd Pilot', 'One ship. Every phone fires one thruster, but nobody knows which direction theirs pushes until they try it. Work together to grab stars and dodge the rocks. 75 seconds.');
  const W = 1600, Hh = 900, ACC = 650, R = 26;
  const off = Math.random() * Math.PI * 2;
  const thr = shuffle(roster).map((p, i, a) => { const ang = off + i / a.length * Math.PI * 2; return { p, ax: Math.cos(ang), ay: Math.sin(ang), on: false }; });
  H.onInput = (p, v) => { const t = thr.find(t => t.p === p); if (t) t.on = !!v; };
  roster.forEach(p => setView(p, { kind: 'pad', mode: 'hold', title: 'Crowd Pilot', label: 'THRUST', sub: 'Hold to fire your thruster. Watch the screen to see which way it pushes.', color: p.color }));
  await countIn('Crowd Pilot', 'Figure out which thruster is yours.');
  stage(`<canvas id="cv" class="cv" width="${W}" height="${Hh}"></canvas>`);
  const cv = $('#cv'), c = cv.getContext('2d');
  const ship = { x: W / 2, y: Hh / 2, vx: 0, vy: 0, inv: 0 };
  const newStar = () => { let s; do { s = { x: 100 + Math.random() * (W - 200), y: 100 + Math.random() * (Hh - 200) }; } while (Math.hypot(s.x - ship.x, s.y - ship.y) < 300); return s; };
  let star = newStar(), score = 0, time = 75, flash = 0, scramble = 15, scrambleMsg = 0;
  const rocks = Array.from({ length: isUnhinged() ? 6 : 4 }, (_, i) => ({ x: i % 2 ? 150 : W - 150, y: i < 2 ? 150 : Hh - 150, vx: (Math.random() - .5) * 260, vy: (Math.random() - .5) * 260, r: 34 + Math.random() * 22 }));
  const bgStars = Array.from({ length: 90 }, () => [Math.random() * W, Math.random() * Hh, Math.random() * 1.6 + .4]);

async function runFridge(roster) {

    T: { m: [[1, 1, 1], [0, 1, 0]], c: '#ff7a45', n: 'Leftovers' }, S: { m: [[0, 1, 1], [1, 1, 0]], c: '#5fe0b5', n: 'Lettuce' },
    Z: { m: [[1, 1, 0], [0, 1, 1]], c: '#ff5d5d', n: 'Ketchup' }, L: { m: [[1, 0], [1, 0], [1, 1]], c: '#ffb36b', n: 'Juice' },
    J: { m: [[0, 1], [0, 1], [1, 1]], c: '#b9a7ff', n: 'Grapes' }
  };
  const ROLES = [{ k: 'left', label: '◀ LEFT' }, { k: 'right', label: 'RIGHT ▶' }, { k: 'rotate', label: '⟳ ROTATE' }, { k: 'drop', label: 'DROP ▼' }];

  const grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  const rot = m => m[0].map((_, i) => m.map(row => row[i]).reverse());
  const fits = (m, x, y) => m.every((row, j) => row.every((v, i) => !v || (x + i >= 0 && x + i < COLS && y + j < ROWS && (y + j < 0 || !grid[y + j][x + i]))));
  let piece = null, lines = 0, time = 120, over = false, acc = 0, swapIn = 25;
  const spawn = () => { const s = SH[pick(Object.keys(SH), 1)[0]]; piece = { m: s.m, c: s.c, n: s.n, x: Math.floor((COLS - s.m[0].length) / 2), y: 0 }; if (!fits(piece.m, piece.x, piece.y)) over = true; };
  const lock = () => {
    piece.m.forEach((row, j) => row.forEach((v, i) => { if (v && piece.y + j >= 0) grid[piece.y + j][piece.x + i] = piece.c; }));
    for (let y = ROWS - 1; y >= 0; y--) if (grid[y].every(Boolean)) { grid.splice(y, 1); grid.unshift(Array(COLS).fill(null)); lines++; y++; }

    else if (k === 'right' && fits(piece.m, piece.x + 1, piece.y)) piece.x++;
    else if (k === 'rotate') { const m = rot(piece.m); for (const dx of [0, -1, 1, -2, 2]) if (fits(m, piece.x + dx, piece.y)) { piece.m = m; piece.x += dx; break; } }
    else if (k === 'drop') { while (fits(piece.m, piece.x, piece.y + 1)) piece.y++; lock(); }
  };
  roster.forEach(p => { const r = roles.get(p.id); setView(p, { kind: 'pad', mode: 'tap', title: 'You control', label: r.label, sub: 'Tap when your team needs your move.', color: p.color }); });
  const missing = ROLES.filter(r => ![...roles.values()].includes(r));
  await countIn('Stock the Fridge', 'Check your phone for your move.');
  spawn();

    <div class="roles"><div class="eyebrow">Controls</div>${roster.map(p => `<div class="role" id="role-${p.id}" style="--c:${p.color}"><b>${roles.get(p.id).label}</b><span>${esc(p.name)}</span></div>`).join('')}
    ${missing.length ? `<p class="muted">No one has ${missing.map(m => m.label).join(', ')}. Gravity does the dropping.</p>` : ''}
    <div class="fstat"><span id="fl">0</span> shelves<br><span id="ft">120</span>s left</div></div></div>`);
  const cv = $('#cv'), c = cv.getContext('2d'), fl = $('#fl'), ft = $('#ft');
  const cell = (x, y, col) => { c.fillStyle = col; c.beginPath(); c.roundRect(x * CELL + 3, y * CELL + 3, CELL - 6, CELL - 6, 10); c.fill(); c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(x * CELL + 10, y * CELL + 9, CELL - 30, 5); };
  await runLoop(dt => {
    time -= dt; acc += dt;
    if (isUnhinged() && (swapIn -= dt) <= 0) {
      swapIn = 25;
      const labels = shuffle([...roles.values()]);
      roster.forEach((p, i) => {
        roles.set(p.id, labels[i]);
        const el = document.getElementById('role-' + p.id); if (el) { el.querySelector('b').textContent = labels[i].label; flashRole(p); }
        setView(p, { kind: 'pad', mode: 'tap', title: 'CONTROLS SWAPPED! You now control', label: labels[i].label, sub: 'Tell your team what you have now.', color: p.color });
      });
    }
    const speed = Math.max(0.2, (isUnhinged() ? 0.6 : 0.8) - lines * 0.03);
    if (acc >= speed) { acc = 0; if (fits(piece.m, piece.x, piece.y + 1)) piece.y++; else lock(); }

    grid.forEach((row, y) => row.forEach((col, x) => col && cell(x, y, col)));

  });

  roster.forEach(p => waitView(p, `Your team stocked ${lines} ${lines === 1 ? 'shelf' : 'shelves'}.`));
  await hostNext('Back to menu');
}

const PALETTE = ['#10142e', '#ff5d5d', '#ff7a45', '#ffd84d', '#5fe0b5', '#6ec8ff', '#b9a7ff', '#ffffff'];
function drawStrokes(c, strokes, s = 1, dx = 0, dy = 0) {
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (const st of strokes || []) {
    const p = st.p; if (!p || p.length < 2) continue;
    c.strokeStyle = PALETTE[st.c] || PALETTE[0]; c.lineWidth = st.w * s;
    c.beginPath(); c.moveTo(dx + p[0] * s, dy + p[1] * s);
    if (p.length === 2) c.lineTo(dx + p[0] * s + 0.1, dy + p[1] * s);
    for (let i = 2; i < p.length; i += 2) c.lineTo(dx + p[i] * s, dy + p[i + 1] * s);
    c.stroke();
  }
}
function cleanDrawing(v) {
  const out = { strokes: [] };
  if (!v || !Array.isArray(v.strokes)) return out;
  for (const s of v.strokes.slice(0, 500)) {
    if (!s || !Array.isArray(s.p)) continue;
    let p = s.p.slice(0, 6000).map(Number).filter(Number.isFinite);
    if (p.length % 2) p = p.slice(0, -1);
    if (p.length < 2) continue;
    out.strokes.push({ c: Math.max(0, Math.min(PALETTE.length - 1, s.c | 0)), w: Math.max(1, Math.min(40, +s.w || 6)), p });
  }
  return out;
}
function paint(id, W, Hh, layers) {

  const c = cv.getContext('2d');
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, W, Hh);
  for (const L of layers) drawStrokes(c, L.d && L.d.strokes, 1, L.dx || 0, L.dy || 0);
}

  stage(`<div class="eyebrow">Vote for the best monster</div><div class="mgallery">${order.map((_, m) => `<figure><canvas id="mv-${m}" class="sketch" width="${PW}" height="${MH}"></canvas><figcaption>${esc(mname(m))}</figcaption></figure>`).join('')}</div>`);
  order.forEach((_, m) => paint('mv-' + m, PW, MH, monsterLayers(m)));
  const votes = await collect(order, () => ({ kind: 'choose', prompt: 'Best monster?', options: order.map((_, m) => ({ id: m, label: mname(m) })) }), { seconds: 30 });
  const tally = order.map((_, m) => [...votes.values()].filter(v => v === m).length);
  tally.forEach((t, m) => parts[m].forEach(d => d.by.score += t));
  const best = Math.max(...tally), winners = order.map((_, m) => m).filter(m => tally[m] === best);
  const w = winners[0];
  stage(`<div class="monsterreveal"><canvas id="mw" class="sketch tall" width="${PW}" height="${MH}"></canvas>
    <div><div class="eyebrow">Best monster · ${best} ${best === 1 ? 'vote' : 'votes'}</div><h1 class="big quote">${winners.map(m => esc(mname(m))).join(' &amp; ')}</h1>
    <p class="sub">Every vote gave a point to each of the monster's three artists.</p></div></div>`);
  paint('mw', PW, MH, monsterLayers(w));

  await leaderboard(roster, 'Maddest scientist');
}

/* ---------------- Game: Gallery of Lies ---------------- */

  const items = shuffle(roster.map((p, i) => ({ artist: p, title: prompts[i], d: cleanDrawing(dr.get(p.id)) })));

      entries.push({ id: p.id, text: t, author: p });

      <div class="deflist">${entries.map((e, i) => `<div class="def"><span class="dl">${letter(i)}</span><span>${esc(e.text)}</span></div>`).join('')}</div></div></div>`);
    paint('gl', W, Hh, [{ d: it.d }]);
    const votes = await collect(roster, p => ({ kind: 'choose', prompt: 'Which title is real?', sub: p === it.artist ? 'You drew this, so your vote doesn\'t count. Pick anything.' : '',
      options: entries.filter(e => e.id !== p.id).map(e => ({ id: e.id, label: e.text })) }), { seconds: 35 });
    votes.delete(it.artist.id);
    const pickedBy = id => [...votes].filter(([, v]) => v === id).map(([k]) => byId(k));
    for (const [pid, v] of votes) { if (v === 'real') { byId(pid).score += 2; it.artist.score += 1; } else { const e = entries.find(e => e.id === v); if (e && e.author) e.author.score += 1; } }
    stage(`<div class="gallerywrap">${art()}<div><div class="eyebrow">Drawn by ${nameList([it.artist])}</div>
      <div class="deflist">${entries.map((e, i) => { const by = pickedBy(e.id); return `<div class="def ${e.id === 'real' ? 'real' : ''}"><span class="dl">${letter(i)}</span><span>${esc(e.text)}

      ${lucky.length ? `<p class="sub">${nameList(lucky)} guessed it exactly.</p>` : ''}</div></div>`);
